name: Fantasy Sharks ROS projections to Supabase

# JEG-621: Fantasy Sharks rest-of-year projections -> public.fantasysharks_projections.
#
#   pipelines/pull_fantasysharks.py   -> /tmp/fantasysharks/snapshot.json, fail closed
#     with named codes (SOURCE_BLOCKED, SOURCE_LAYOUT, PPG_GATE/range codes)
#   pipelines/save_fantasysharks_references.py -> public.fantasysharks_projections
#
# Scheduler owner: source-probe.yml (pipelines/source_probe.py source
# `fantasysharks`, pg_cron `source-probe-sharks`): dispatched on change or max
# age 20 h, with mode=write. No `schedule:` here. No rebuild-chain dispatch:
# nothing in the chain reads this table yet.
#
#   push to fantasysharks/dry-*   -> --dry-run
#   push to fantasysharks/write-* -> write
#   workflow_dispatch            -> dry unless mode=write

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or write"
        required: false
        default: "dry"
      probe_fp:
        description: "Set by source-probe.yml: the fingerprint to acknowledge on success (blank = manual run)"
        required: false
        default: ""
  push:
    branches: ["fantasysharks/dry-*", "fantasysharks/write-*"]

permissions:
  contents: read

concurrency:
  group: fantasysharks-supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Resolve mode
        id: cfg
        run: |
          mode=dry
          case "${GITHUB_REF_NAME}" in fantasysharks/write-*) mode=write;; esac
          [ "${{ github.event.inputs.mode }}" = "write" ] && mode=write
          echo "mode=$mode" >> $GITHUB_OUTPUT
          echo "::notice title=fantasysharks::mode=$mode"

      # JEG-480 / JEG-520: a run the probe did not dispatch (manual or
      # scheduled) still records which publisher content it read: the probe
      # fingerprint taken before the data is read is acknowledged with it,
      # so the fidelity pulse can tell a stored copy that differs from the
      # same publisher version (a fault: red, held) from a publisher update
      # made after the save (amber). Taken first, a race can only
      # yield amber, never a false red.
      - name: Fingerprint the publisher first (run not dispatched by the probe)
        id: fp
        if: steps.cfg.outputs.mode == 'write' && github.event.inputs.probe_fp == ''
        continue-on-error: true
        run: |
          python3 pipelines/source_probe.py probe --sources fantasysharks --dry-run --out /tmp/probe-fantasysharks.jsonl > /dev/null
          fp=$(head -n 1 /tmp/probe-fantasysharks.jsonl | jq -r '.fingerprint // ""')
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          echo "publisher fingerprint, read first: ${fp:-none}"

      - name: Scrape and save
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Outcome surfaced as check-run annotations (Actions logs are not
          # downloadable through every proxy).
          flag=""
          [ "${{ steps.cfg.outputs.mode }}" = "write" ] || flag="--dry-run"
          rc=0
          {
            python3 pipelines/pull_fantasysharks.py --out-dir /tmp/fantasysharks &&
            python3 pipelines/save_fantasysharks_references.py --snapshot /tmp/fantasysharks/snapshot.json $flag
          } > /tmp/fantasysharks.log 2>&1 || rc=$?
          cat /tmp/fantasysharks.log
          level=notice; [ "$rc" = 0 ] || level=error
          tail -8 /tmp/fantasysharks.log | cut -c1-900 | sed "s/^/::$level title=fantasysharks rc=$rc::/"
          grep -h -m2 -E "^fantasysharks:" /tmp/fantasysharks.log | cut -c1-600 | sed "s/^/::notice title=fantasysharks pull::/" || true
          # Named codes from the puller: SOURCE_BLOCKED, SOURCE_LAYOUT, stale vintage; SYNC_FAILED = the saver.
          code=SYNC_FAILED
          pulled=$(grep -o "FANTASYSHARKS PULL FAILED \[[A-Z_]*\]" /tmp/fantasysharks.log | sed 's/.*\[\(.*\)\]/\1/' | head -1 || true)
          [ -n "$pulled" ] && code=$pulled
          echo "error_code=$code" >> $GITHUB_OUTPUT
          exit $rc

      - name: Keep the snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasysharks-snapshot
          path: /tmp/fantasysharks/snapshot.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Record the monitored check
        if: always() && steps.cfg.outputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OK: ${{ steps.sync.outcome == 'success' }}
          ERROR_CODE: ${{ steps.sync.outputs.error_code }}
        run: |
          python3 - <<'PY'
          import os, sbclient
          ok = os.environ["OK"] == "true"
          sbclient.rpc("monitoring_record_observation", {
              "p_check_id": "fantasysharks_projections_sync",
              "p_ok": ok, "p_content_ok": ok,
              "p_error_code": None if ok else (os.environ.get("ERROR_CODE") or "SYNC_FAILED"),
              "p_scheduler_owner_id": "fantasysharks-supabase-sync.yml",
          })
          print("recorded ok=%s" % ok)
          PY

      # Refresh cadence (source-probe.yml, pipelines/source_probe.py): acknowledge
      # the probe fingerprint this run was dispatched for, so the probe stops
      # re-dispatching it.
      # After the monitored-check step on purpose: an ack failure must not
      # record the ingest itself as failed.
      - name: Acknowledge probe fingerprint
        id: ack
        if: success() && (github.event.inputs.probe_fp != '' || steps.fp.outputs.fp != '') && steps.cfg.outputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROBE_FP: ${{ github.event.inputs.probe_fp || steps.fp.outputs.fp }}
        run: python3 pipelines/source_probe.py ack --supabase --source fantasysharks --fingerprint "$PROBE_FP"

      - name: Retain Supabase byte counters (JEG-1458)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-bytes-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-bytes/*.md
          if-no-files-found: ignore
          retention-days: 14
