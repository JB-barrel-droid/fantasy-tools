name: Preview build

# JEG-31. Builds exactly what pages.yml would publish for this commit and uploads it
# as a workflow artifact plus a per-file manifest. It NEVER deploys: no Pages
# permissions, no deploy step. Keep the build steps below identical to pages.yml;
# tests/test_preview_workflow_matches_pages.py fails if they drift.
#
# JEG-1170: both workflows split make validate into validate-base plus the exact
# test-core shards. Here the preview check needs preview-build and every shard;
# Pages needs its build and every shard before publishing its built artifact.
#
# Deliberate differences from pages.yml:
#   - the full test suite (make test-unit) no longer runs on PRs: it never
#     finished inside its 45-minute timeout and held a runner, so it moved to
#     full-suite.yml, nightly plus workflow_dispatch (JEG-1169; JEG-978 before);
#   - pull requests that change only docs skip this check (JEG-1169);
#   - checkout uses the PR head SHA, not the default merge ref, so the build tag
#     (derived from HEAD's commit time and SHA) matches what production would build.

on:
  pull_request:
    # JEG-1169: skip docs-only PRs. A PR runs this check unless every changed
    # file is Markdown or under docs/. Tests-only PRs still run it. The docs
    # the build reads (sync_dashboard_artifacts -> build_values_explainer,
    # build_llm_surfaces) stay included.
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/methodology.md"
      - "docs/math-review-agenda.md"
      - "docs/use-ddf-in-claude-chatgpt.md"
      - "app/llm/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-build:
    runs-on: ubuntu-latest
    # JEG-1169: the default is 6 hours. A normal run is ~45 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The headless render tests in `make validate` need a browser. Without
      # one they skipped and validate passed with them unrun (until
      # 2026-10-08). RENDER_TESTS_REQUIRED=1 makes a missing browser or build
      # an error for every later step instead of a silent skip.
      # JEG-1169: cache the Chromium download. The key carries the Playwright
      # version pinned below and in tests/rendered_gate/package.json (both
      # 1.49.1 share one browser build), so a version bump misses the cache and
      # downloads the matching build. --with-deps still installs the OS packages.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: Browser for the render tests
        run: |
          python3 -m pip install --quiet playwright==1.49.1
          python3 -m playwright install --with-deps chromium
          echo "RENDER_TESTS_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Validation coverage and workflow guards
        run: python3 -m unittest tests.test_validate_shards tests.test_preview_workflow_matches_pages tests.test_deploy_gate_unconditional tests.test_ci_speedup_workflows
      - run: make sync
      # JEG-1170: test-core runs in the preview-shard jobs.
      - run: make validate-base
      # Monitor signals refreshed on every deploy (warnings, never deploy
      # blocks; Jeremy 2026-10-08). GAP-E2E-FIDELITY: the JEG-77 card's only
      # producer. GAP-031: the ESPN-zeroed staleness signal (exits 1 when it
      # finds stale sources; that is the signal, not a build failure).
      - name: Build end-to-end fidelity card
        run: python3 pipelines/build_e2e_fidelity.py
        continue-on-error: true
      - name: Refresh data accuracy signals
        run: python3 pipelines/check_data_accuracy.py
        continue-on-error: true
      - name: Build dist manifest
        id: manifest
        run: |
          python3 pipelines/dist_manifest.py build dist --out dist-manifest.json
          echo "root=$(python3 -c "import json; print(json.load(open('dist-manifest.json'))['root_sha256'])")" >> "$GITHUB_OUTPUT"
          echo "tag=$(grep -o 'tv-[0-9]\{8\}-[0-9]\{4\}-[0-9a-f]*' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: preview-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist
            dist-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Rendered gate (headless browser on the built dist)
        id: gate
        run: |
          npm ci --prefix tests/rendered_gate
          # JEG-1169: no second Chromium install. playwright-core 1.49.1 uses the
          # browser the python playwright 1.49.1 step installed (same build, same cache dir).
          # JEG-1152: pin the gate pages' clock to the data's week.
          export TRADE_VALUE_TODAY="$(python3 -c 'from tests.test_week_history import _fixture_today; print(_fixture_today())')"
          echo "TRADE_VALUE_TODAY=$TRADE_VALUE_TODAY"
          set +e
          node tests/rendered_gate/gate.mjs dist --out rendered-gate.json
          rc=$?
          node tests/rendered_gate/bench_share_readout_harness.mjs dist
          rc2=$?
          node tests/rendered_gate/gate_flexibility.mjs dist
          rc3=$?
          set -e
          echo "page_errors=$(python3 -c "import json; print(len(json.load(open('rendered-gate.json'))['pageErrors']))")" >> "$GITHUB_OUTPUT"
          echo "pie_bad=$(python3 -c "import json; d=json.load(open('rendered-gate.json')); print(len(d['pieBad']), 'of', len(d['pie']))")" >> "$GITHUB_OUTPUT"
          if [ $rc2 -ne 0 ]; then echo "JEG-103 bench-share readout guard failed"; fi
          if [ $rc3 -ne 0 ]; then echo "JEG-135 rendered input sweep failed"; fi
          # Every harness in this step blocks (2026-10-08): the bench-share
          # readout and the input sweep used to print and pass.
          if [ $rc -ne 0 ] || [ $rc2 -ne 0 ] || [ $rc3 -ne 0 ]; then exit 1; fi
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.upload.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ROOT: ${{ steps.manifest.outputs.root }}
          TAG: ${{ steps.manifest.outputs.tag }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_ERRORS: ${{ steps.gate.outputs.page_errors }}
          GATE_PIE: ${{ steps.gate.outputs.pie_bad }}
        with:
          script: |
            const marker = '<!-- preview-build -->';
            const sha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              `**Preview build** for \`${sha.slice(0, 7)}\` (validate-base passed; test-core shards report in the preview check)`,
              '',
              `- Build tag: \`${process.env.TAG}\``,
              `- dist manifest root: \`${process.env.ROOT}\``,
              `- Artifact (the exact \`dist/\` plus \`dist-manifest.json\`): ${process.env.ARTIFACT_URL}`,
              `- Rendered gate (blocking): **${process.env.GATE_OUTCOME}**, ` +
                `${process.env.GATE_ERRORS || '?'} uncaught page error(s)`,
              `- DDF fixed pie sums to 100.0 (blocking, JEG-24): ` +
                `shapes failing = ${process.env.GATE_PIE || '?'}`,
              '',
              'To view it: download and unzip the artifact, then ' +
                '`python3 -m http.server 8000 --directory dist`. See `docs/preview-deploys.md`.',
              'Nothing was deployed.',
            ].join('\n');
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  # JEG-1170: validate's test-core runs here as test-core-shard-N, one matrix job per shard,
  # in parallel with preview-build (which runs validate-base: validate minus test-core).
  # Together they are exactly `make validate` (tests/test_validate_shards.py,
  # tests/test_preview_workflow_matches_pages.py). Each shard builds its own dist first,
  # as `make validate` does (reference, then sync).
  preview-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The headless render tests in `make validate` need a browser. Without
      # one they skipped and validate passed with them unrun (until
      # 2026-10-08). RENDER_TESTS_REQUIRED=1 makes a missing browser or build
      # an error for every later step instead of a silent skip.
      # JEG-1169: cache the Chromium download. The key carries the Playwright
      # version pinned below and in tests/rendered_gate/package.json (both
      # 1.49.1 share one browser build), so a version bump misses the cache and
      # downloads the matching build. --with-deps still installs the OS packages.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.49.1
      - name: Browser for the render tests
        run: |
          python3 -m pip install --quiet playwright==1.49.1
          python3 -m playwright install --with-deps chromium
          echo "RENDER_TESTS_REQUIRED=1" >> "$GITHUB_ENV"
      - run: make reference
      - run: make sync
      - run: make test-core-shard-${{ matrix.shard }}

  # JEG-1170: the required check. Named `preview` so the check name is unchanged; it passes
  # only when preview-build and every preview-shard job succeeded (a skipped, cancelled or
  # failed job fails it).
  preview:
    needs: [preview-build, preview-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every build and shard job passed
        env:
          BUILD_RESULT: ${{ needs.preview-build.result }}
          SHARD_RESULT: ${{ needs.preview-shard.result }}
        run: |
          echo "preview-build: $BUILD_RESULT, preview-shard: $SHARD_RESULT"
          [ "$BUILD_RESULT" = "success" ] && [ "$SHARD_RESULT" = "success" ]
