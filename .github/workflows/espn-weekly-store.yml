name: ESPN weekly store (actuals and projections)

# JEG-521 G4 (a)/(b): store what measurement needs. Pipeline only; no value
# change, nothing on the site reads these yet.
#
#   pipelines/pull_espn_projections.py --weekly-out /tmp/espn_weekly
#       the same ESPN fetch the ESPN leg uses; writes every 2026 weekly actual
#       and projection block as rows (pipelines/lib/espn_weekly.py)
#   pipelines/save_espn_weekly.py
#       actuals -> public.player_game_stats (under v_player_game_actuals);
#       projections -> public.projection_snapshots (source espn, change-only);
#       summary -> output/espn-weekly-store.json
#   (JEG-944: save_espn_weekly.py also appends every future week to
#   public.source_projection_captures; check_projection_captures.py gates it)
#   pipelines/export_weekly_store.py
#       refreshes data/inputs/weekly_actuals_2024_2026.csv and
#       data/inputs/espn_weekly_projections_2026.csv from Supabase
#
# Scheduler owner: Supabase pg_cron espn-weekly-store-live (daily 12:40 UTC)
# and espn-weekly-store-sunday (16:20 UTC Sunday),
# supabase/migrations/jeg521_g4_weekly_store_20261009.sql. No `schedule:`.
# workflow_dispatch is dry unless mode=write.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or write"
        required: false
        default: "dry"

permissions:
  contents: write

concurrency:
  group: espn-weekly-store
  cancel-in-progress: false

jobs:
  store:
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Pull ESPN weekly blocks and save
        id: save
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          flag="--dry-run"
          [ "${{ github.event.inputs.mode }}" = "write" ] && flag=""
          rc=0
          {
            python3 pipelines/pull_espn_projections.py --out /tmp/espn_projections.csv \
              --meta /tmp/espn_meta.json --weekly-out /tmp/espn_weekly &&
            python3 pipelines/save_espn_weekly.py --in /tmp/espn_weekly $flag
          } > /tmp/store.log 2>&1 || rc=$?
          grep -v "^  note:" /tmp/store.log | tail -60
          level=notice; [ "$rc" = 0 ] || level=error
          # Outcome as check-run annotations (logs are not readable through every proxy).
          grep -v "^  note:" /tmp/store.log | tail -40 | tr '\n' ' ' | cut -c1-3500 | sed "s/^/::$level title=espn weekly store rc=$rc::/"
          echo
          { echo "## ESPN weekly store"; echo '```'; grep -v "^  note:" /tmp/store.log | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Refresh the repo copies from Supabase
        if: github.event.inputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipelines/export_weekly_store.py | tee /tmp/export.log
          sed "s/^/::notice title=weekly store export::/" /tmp/export.log

      - name: Commit the refreshed files
        if: github.event.inputs.mode == 'write'
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer espn-weekly-store-1 --phase "$1" --target "${GITHUB_REF_NAME:-main}"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            git push "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inputs/weekly_actuals_2024_2026.csv data/inputs/espn_weekly_projections_2026.csv
          git add -f output/espn-weekly-store.json  # output/ is gitignored
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            release_guard stage
            git commit -m "ESPN weekly store: actuals and projections refresh (JEG-521 G4, GitHub Actions)"
            git pull --rebase --autostash origin main
            release_push
          fi

      # JEG-944: fails the run (red) when a content week's capture of any source
      # (espn, cbs, razzball) is missing from public.source_projection_captures.
      # Runs after the commit step so it never holds back the store itself.
      - name: Retain deferred publication (espn-weekly-store-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-espn-weekly-store-1-${{ github.run_attempt }}
          path: output/release-publications/espn-weekly-store-1/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check projection captures (JEG-944)
        if: always() && github.event.inputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/check_projection_captures.py

      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && github.event.inputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id espn_weekly_store --owner espn-weekly-store.yml --outcome "${{ job.status }}"
