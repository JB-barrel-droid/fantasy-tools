name: Weekly dashboard load to Supabase

# Loads the canonical weekly signals bundle into the Supabase weekly
# dashboard tables (weekly_dashboard_runs / weekly_dashboard_signals),
# flipping is_current only after the loader verifies the view count.
# Idempotent: exits 0 with NOOP when the current run already covers the bundle.
#
# Runs LIVE on schedule. While weekly production is paused (JEG-ECR-EXIT
# retired the ECR feed; transition tracked in JEG-399), no new bundles are
# published, so the job simply NOOPs each day until bundles flow again.
# Standing direction (Jeremy): as many processes as possible live in
# Supabase, with minor assistance from GitHub — never on the Muse runtime.

on:
  schedule:
    # Daily at 16:07 UTC (11:07 CT)
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Load weekly bundle to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          # Contract: the weekly refresh pipeline publishes the canonical
          # staged bundle to data/weekly/ when weekly production resumes
          # (JEG-399). Newest bundle wins; fail-closed when none exists.
          BUNDLE="$(ls -t data/weekly/staged_bundle_*.json 2>/dev/null | head -1)"
          test -n "${BUNDLE}" || { echo "::error::no staged bundle in data/weekly/"; exit 2; }
          echo "Loading ${BUNDLE}"
          python3 pipelines/load_weekly_dashboard.py --bundle "${BUNDLE}"

      - name: Freshness SLA check
        # Always runs — even when the load step fails or NOOPs — so a stale
        # dashboard is announced rather than silently green. Read-only.
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/check_weekly_freshness.py

      # Monitoring: record this run in Supabase monitoring.check_observations,
      # red or green. A run that never happens is flagged `missed` by the
      # evaluator. Never fails the job. Declared in config/monitoring_coverage.json.
      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id weekly_dashboard_load --owner weekly-dashboard-load.yml --outcome "${{ job.status }}"
