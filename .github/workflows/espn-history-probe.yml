name: ESPN history probe (manual)

# JEG-521 G4 (d): does ESPN's fantasy API serve prior-season weekly
# projections and actuals? Read-only; pipelines/probe_espn_history.py writes
# output/espn-history-probe.json, committed so the answer is in the repo.
# Manual only (no schedule): a one-off question, re-run when needed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read ESPN and report results without minting a writer token or publishing"
        type: boolean
        default: false

permissions:
  contents: read  # JEG-1441: main writes use the environment-scoped App.

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    environment: main-writer
    runs-on: ubuntu-latest  # Isolate App credentials from shared runners.
    steps: &writer-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        run: |
          python3 pipelines/probe_espn_history.py | tee /tmp/probe.md
          tr '\n' ' ' < /tmp/probe.md | sed "s/^/::notice title=espn history probe::/"
          echo
          cat /tmp/probe.md >> "$GITHUB_STEP_SUMMARY"
      - name: Mint main writer token
        id: main-writer
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry_run }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned
        with:
          app-id: ${{ secrets.MAIN_WRITER_APP_ID }}
          private-key: ${{ secrets.MAIN_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit the result
        if: ${{ !inputs.dry_run }}
        env:
          MAIN_WRITER_TOKEN: ${{ steps.main-writer.outputs.token }}
          BRANCH_WRITER_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!python3 -B "$GITHUB_WORKSPACE/.github/scripts/main-writer-credential.py"'
          GIT_CONFIG_KEY_2: credential.useHttpPath
          GIT_CONFIG_VALUE_2: 'true'
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer espn-history-probe-1 --phase "$1" --target "${GITHUB_REF_NAME:-main}"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            if [ "$#" -eq 0 ]; then set -- origin "HEAD:${GITHUB_REF:?}"; fi
            git push "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/espn-history-probe.json  # output/ is gitignored
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            release_guard stage
            git commit -m "ESPN history probe result (JEG-521 G4 d, GitHub Actions)"
            git pull --rebase --autostash origin main
            release_push
          fi
      - name: Retain deferred publication (espn-history-probe-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-espn-history-probe-1-${{ github.run_attempt }}
          path: output/release-publications/espn-history-probe-1/
          if-no-files-found: ignore
          retention-days: 14

  probe-branch:
    if: github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: *writer-steps
