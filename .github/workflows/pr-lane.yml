name: PR lane
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      # Trusted base only. Never check out or execute PR head code with this event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest tests.test_pr_lane
      - run: python3 scripts/check_pr_lane.py --event "$GITHUB_EVENT_PATH"
