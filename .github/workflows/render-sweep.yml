name: Render sweep

# JEG-976 (Jeremy, 2026-10-23: option b, a separate scheduled render job).
# Runs the green headless render modules that neither `make validate` nor the
# preview suite runs (`make test-render-extra`, about 25 minutes). It is a
# warning, never a gate: no deploy workflow calls it, so a failure here shows
# as a red run plus a warning annotation and holds nothing.
#
# Trigger: workflow_dispatch only. Schedules live in Supabase pg_cron (no
# `schedule:` here); the daily job `render-sweep-daily` would dispatch this
# file, see supabase/render_sweep_pg_cron.sql (not yet applied).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-sweep
  cancel-in-progress: false

jobs:
  render-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser for the render tests
        run: |
          python3 -m pip install --quiet playwright==1.49.1
          python3 -m playwright install --with-deps chromium
          echo "RENDER_TESTS_REQUIRED=1" >> "$GITHUB_ENV"
      - run: make sync
      - name: Render sweep (one module at a time)
        run: |
          if ! make test-render-sweep; then
            echo "::warning title=Render sweep failed::At least one render module failed. Nothing was held; see the run log for the module names."
            exit 1
          fi
