name: Sleeper identity refresh (JEG-366)

# Refreshes data/inputs/sleeper_identity_base.json (the identity base layer
# under the manual table) from Sleeper /players/nfl. Fails closed on a
# partial pull, runs the identity tests against the new file, and commits
# only when player content changed (not just meta.pulled_at).
#
#   pg_cron dispatch (Tue + Thu 09:17 UTC, `sleeper-identity-refresh-live`,
#   supabase/migrations/gha_schedules_pg_cron.sql; dispatches on main) -> commit to main
#   push to identity/**                               -> commit back to that branch
#   manual dispatch                                    -> commit to the dispatched ref

on:
  push:
    branches: ["identity/**"]
    paths-ignore: ["data/inputs/sleeper_identity_base.json"]
  workflow_dispatch:

permissions:
  contents: read  # JEG-1441: main writes use the environment-scoped App.

concurrency:
  group: sleeper-identity-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    environment: main-writer
    runs-on: ubuntu-latest  # Isolate App credentials from shared runners.
    steps: &writer-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep the current base for comparison
        run: cp data/inputs/sleeper_identity_base.json /tmp/previous_base.json || echo '{}' > /tmp/previous_base.json

      - name: Pull Sleeper (fail-closed on partial pull)
        run: python3 pipelines/pull_sleeper_identity.py

      - name: Identity tests against the new base
        run: |
          python3 -m unittest tests.test_sleeper_identity_layer
          python3 -m unittest tests.test_player_identity_guard
          python3 -m unittest tests.test_match_identity_keys
          python3 -m unittest tests.test_source_snapshot_match
          python3 -m unittest tests.test_sync_players_active

      - name: Did player content change?
        id: diff
        run: |
          changed=$(python3 - <<'EOF'
          import json
          def body(p):
              try:
                  d = json.load(open(p))
              except Exception:
                  return None
              d.pop("meta", None)
              return d
          print("yes" if body("/tmp/previous_base.json") != body("data/inputs/sleeper_identity_base.json") else "no")
          EOF
          )
          echo "changed=$changed" >> $GITHUB_OUTPUT
          python3 -c "import json; m=json.load(open('data/inputs/sleeper_identity_base.json'))['meta']; print('::notice title=sleeper-identity::' + json.dumps(m) + ' changed=$changed')"

      - name: Mint main writer token
        id: main-writer
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned
        with:
          app-id: ${{ secrets.MAIN_WRITER_APP_ID }}
          private-key: ${{ secrets.MAIN_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit
        if: steps.diff.outputs.changed == 'yes'
        env:
          MAIN_WRITER_TOKEN: ${{ steps.main-writer.outputs.token }}
          BRANCH_WRITER_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!python3 -B "$GITHUB_WORKSPACE/.github/scripts/main-writer-credential.py"'
          GIT_CONFIG_KEY_2: credential.useHttpPath
          GIT_CONFIG_VALUE_2: 'true'
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer sleeper-identity-refresh-1 --phase "$1" --target "${GITHUB_REF_NAME:-main}"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            if [ "$#" -eq 0 ]; then set -- origin "HEAD:${GITHUB_REF:?}"; fi
            git push "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inputs/sleeper_identity_base.json
          release_guard stage
          git commit -m "Sleeper identity base refresh (JEG-366)"
          release_push origin HEAD:${GITHUB_REF_NAME}

      # JEG-502: every active NFL QB/RB/WR/TE needs a players-table row so the
      # bake can give him a players.json row (JEG-438: no made-up keys).
      # Additive inserts only, keyed by metadata.sleeper_id; dry run off main.
      - name: Retain deferred publication (sleeper-identity-refresh-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-sleeper-identity-refresh-1-${{ github.run_attempt }}
          path: output/release-publications/sleeper-identity-refresh-1/
          if-no-files-found: ignore
          retention-days: 14

      - name: Add missing active NFL players to public.players (JEG-502)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          flag=""
          [ "${GITHUB_REF}" = "refs/heads/main" ] && flag="--write"
          PYTHONPATH=/tmp/gh_shim python3 pipelines/sync_sleeper_players.py $flag

      # JEG-1354: players.active was set once by the archived nflverse loader and
      # never refreshed (false for 857 of 1,517 skill rows on 2026-10-29). This
      # sets it from the active NFL universe, ids first (pipelines/sync_players_active.py).
      # Dry run until Jeremy approves the write: it writes only on main and only
      # while the repository variable PLAYERS_ACTIVE_SYNC is "write".
      - name: Refresh players.active from the active NFL universe (JEG-1354)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PLAYERS_ACTIVE_SYNC: ${{ vars.PLAYERS_ACTIVE_SYNC }}
        run: |
          flag=""
          [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${PLAYERS_ACTIVE_SYNC}" = "write" ] && flag="--write"
          PYTHONPATH=/tmp/gh_shim python3 pipelines/sync_players_active.py $flag

      # Monitoring: record this run in Supabase monitoring.check_observations,
      # red or green. A run that never happens is flagged `missed` by the
      # evaluator. Never fails the job. Declared in config/monitoring_coverage.json.
      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id sleeper_identity_refresh --owner sleeper-identity-refresh.yml --outcome "${{ job.status }}"

  refresh-branch:
    if: github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps: *writer-steps
