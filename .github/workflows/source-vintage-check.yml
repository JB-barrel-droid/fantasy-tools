name: Source vintage check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py 2>/dev/null || \
            (mkdir -p /tmp/gh_shim && cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py)
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Check source vintage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/check_source_vintage.py --json
