name: Rebuild comparison chain

# Fully independent of Muse. Runs the import -> health -> comparison rebuild
# chain on GitHub's infra using repo secrets.
#
# Required secrets (set in repo Settings > Secrets and variables > Actions):
#   SUPABASE_URL          e.g. https://iskiybsimubiujwuchsl.supabase.co
#   SUPABASE_SERVICE_KEY  the Supabase service_role key
#
# The GITHUB_TOKEN is automatic; no setup needed.

on:
  # JEG-76: no fixed schedule. The hourly source-vintage-check.yml dispatches
  # this workflow only when DB content vintage differs from fixture vintage.
  # JEG-109's status-refresh step still runs on every dispatched execution.
  workflow_dispatch:
    # Manual trigger from the Actions tab.
    inputs:
      # JEG-269: source-vintage-check.yml dispatches with
      # -f source="source-vintage-check". The dispatches API rejects inputs
      # that are not declared here (HTTP 422: workflow does not have the
      # input), so this must stay in sync with the caller's -f/--field args.
      source:
        description: "Which dispatcher triggered this run (provenance)"
        required: false
        default: "manual"
      # Daily ESPN anchor refresh (pg_cron rebuild-chain-bake-live). When
      # "true", the run takes the ESPN CSV the latest scrape saved to
      # Supabase, re-bakes players.json, and only then runs the chain, so the
      # chain's `make validate` gates the new anchor and every section indexed
      # to it together, and the commit step pushes them in one commit.
      bake_players:
        description: "Refresh the ESPN anchor and re-bake players.json before the chain"
        required: false
        default: "false"

permissions:
  contents: write  # needed to commit and push the rebuilt fixture
  actions: write  # needed to dispatch pages.yml via API (JEG-274)

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the promote step's git-revision stamping works.
          fetch-depth: 0

      # JEG-137 R10: capture the run start time as early as possible so the
      # scheduler-slip measurement (started_at - cron_at) reflects when the
      # run began, not when the recording step runs at the end of the job.
      - name: Record workflow start time (JEG-137 R10)
        run: echo "WORKFLOW_STARTED_AT=$(date -u +%FT%TZ)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          # The pipelines import `sbclient`, which normally uses Muse's
          # credential system. Outside Muse, shim it with the env-based client.
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py 2>/dev/null || \
            (mkdir -p /tmp/gh_shim && cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py)
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Determine NFL week
        id: week
        run: echo "nfl_week=$(python3 pipelines/nfl_week.py)" >> $GITHUB_OUTPUT

      - name: Import fresh snapshots from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # import_supabase_references.py takes --source (one of the six),
          # not --nfl-week. Import each source explicitly.
          # source-resiliency-001: one source's failed import (publisher page
          # down, empty table, Supabase read error) must not end the job.
          # That source gets no fresh snapshot, so the chain keeps its last
          # promoted section (older-week label) and the others publish.
          failed_imports=""
          for src in fantasycalc usatoday fantasypros espn cbs cbsros razzball; do
            if ! python3 pipelines/import_supabase_references.py --source "$src"; then
              echo "::warning title=import ($src)::import failed; $src keeps its last promoted section"
              failed_imports="$failed_imports $src"
            fi
          done
          if [ -n "$failed_imports" ]; then echo "Imports failed:$failed_imports"; fi

      # The ESPN anchor (data/inputs/espn_projections.csv) feeds both
      # bake_players.py and the chain's 12 ESPN DDF legs. The scrape saves to
      # Supabase daily but never updated the committed CSV, so the anchor only
      # moved on a manual refresh. Non-blocking: a failed bake restores the
      # committed anchor below and the chain runs on it (staleness is a
      # warning). Nothing here commits; the commit step pushes the baked files
      # only after the chain and its `make validate` pass.
      - name: Refresh ESPN anchor and bake players.json
        id: bake
        if: github.event.inputs.bake_players == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The exact CSV the latest ESPN scrape on main saved to Supabase
          # (espn-supabase-sync.yml uploads it as the espn-projections artifact).
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=espn-projections&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].workflow_run.id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then echo "::error::no espn-projections artifact from main"; exit 1; fi
          rm -rf /tmp/espn-artifact
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name espn-projections --dir /tmp/espn-artifact
          # Fail closed unless the CSV is the snapshot Supabase holds as latest.
          python3 pipelines/check_espn_bake_csv.py /tmp/espn-artifact/espn_projections.csv
          cp /tmp/espn-artifact/espn_projections.csv data/inputs/espn_projections.csv
          # CBS ROS from Supabase into a scratch dir, apart from the importer's
          # data/raw snapshot.
          rm -rf /tmp/bake-cbsros
          python3 pipelines/export_cbsros_snapshot.py --out-dir /tmp/bake-cbsros
          snap=$(ls -d /tmp/bake-cbsros/*/snapshot.json | sort | tail -1)
          # Razzball from the snapshot the import step wrote from Supabase (the
          # one the chain's Razzball section is built from), never the stale
          # committed CSV (GAP-RAZZBALL-SUFFIX-POOL).
          rz=$(ls -d data/raw/sources/razzball/*/snapshot.json | sort | tail -1)
          python3 pipelines/bake_players.py --cbsros-snapshot "$snap" --razzball-snapshot "$rz" | tee /tmp/bake.log
          python3 pipelines/pin_naming_manifest.py --source-label "supabase:players"
          { echo "## ESPN anchor bake (run $run_id)"; tail -12 /tmp/bake.log; } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore committed ESPN anchor (bake failed)
        if: steps.bake.outcome == 'failure'
        run: |
          echo "::warning title=bake-players::bake failed; the chain runs on the committed ESPN anchor and players.json"
          git checkout -- data/inputs/espn_projections.csv \
                          data/fixtures/current/players.json \
                          data/fixtures/current/players.naming-manifest.json

      - name: Run import health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Copy the health artifact to the monitor even when the gate is RED.
        # output/ is gitignored, so dist/modules/ is the only copy the commit
        # step can publish; before 2026-10-06 the cp ran only on GREEN, and a
        # red gate left the monitor showing an older (often Muse-local) result.
        run: |
          set +e
          python3 pipelines/verify_import_health.py --nfl-week ${{ steps.week.outputs.nfl_week }}
          rc=$?
          set -e
          cp output/source-import-health.json dist/modules/source-import-health.json \
            || echo "::warning::verify_import_health wrote no artifact; nothing to publish"
          # Go-live (2026-10-07): import health is a warning, not a stop. The
          # chain's own per-source review decides what publishes; a stale or
          # mismatched import shows as an older week on the page.
          if [ "$rc" -ne 0 ]; then echo "::warning title=import-health::gate exit $rc (non-blocking)"; fi

      # Week history (docs/v2-design-notes.md "Back-end contract: history"):
      # append each source's saved inputs per content week to data/history/
      # (published charts from api.source_inputs_weekly, projections from the
      # served players.json and the Supabase projection tables). Past weeks are
      # frozen; the no-relabel guard refuses any entry whose content evidence
      # is another week. Non-blocking: a failed capture restores the committed
      # history and the chain publishes without it (Risers & fallers then
      # reads the last committed weeks). The chain's `make validate` copies
      # the history beside the page and rebuilds its index for the new fixture.
      - name: Capture week history
        id: history
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/build_week_history.py --supabase

      - name: Restore committed week history (capture failed)
        if: steps.history.outcome == 'failure'
        run: |
          echo "::warning title=week-history::capture failed; the committed history is kept"
          git checkout -- data/history

      - name: Rebuild comparison chain (if fixture stale)
        id: chain
        # The chain fails closed: any failure, an unisolated hold, or a run in
        # which every review-gated source held exits non-zero. A review 'hold'
        # in one source is isolated (per-source-promotion-001): that source
        # keeps its last promoted section, the others publish, and the chain
        # exits 0 with the hold in comparison-chain-status.json `held` (and the
        # rebuild_chain_source_held* checks below). Since source-resiliency-001
        # any single-source failure (not only a hold) is isolated the same way.
        # Do not stop the job here,
        # because the chain status must still reach the monitor when it is red
        # (JEG-8). The job is failed explicitly by the last step.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BAKE_OUTCOME: ${{ steps.bake.outcome }}
        # GAP-MAIN-STATIC-PIN (2026-10-07): the rebuilt fixture must pass
        # `make validate` (the Pages deploy's own gate) BEFORE it can be
        # committed. 0b0ddee pushed a fixture that failed
        # tests.test_static_export and turned main red. Validation runs inside
        # this step so a red validate makes steps.chain.outcome 'failure' and
        # the existing failure path publishes only the status, never the
        # fixture. Supabase secrets are stripped: validation is offline.
        run: |
          python3 pipelines/rebuild_comparison_chain.py --nfl-week ${{ steps.week.outputs.nfl_week }}
          # source-resiliency-001: a failed ESPN chain keeps the last good ESPN
          # section and legs (the chain restores them). A fresh bake must not
          # ship beside that kept section: put the committed anchor back.
          if [ "${BAKE_OUTCOME:-}" = "success" ] && python3 -c 'import json,sys; s=json.load(open("output/comparison-chain-status.json")); sys.exit(0 if "espn" in (s.get("held") or []) else 1)'; then
            echo "::warning title=bake-players::ESPN chain failed; keeping the committed ESPN anchor and players.json"
            git checkout -- data/inputs/espn_projections.csv \
                            data/fixtures/current/players.json \
                            data/fixtures/current/players.naming-manifest.json
          fi
          mkdir -p output
          set +e
          env -u SUPABASE_URL -u SUPABASE_SERVICE_KEY make validate > output/post-rebuild-validate.log 2>&1
          rc=$?
          set -e
          cat output/post-rebuild-validate.log
          if [ "$rc" -ne 0 ]; then
            python3 pipelines/record_post_rebuild_validation.py --log output/post-rebuild-validate.log
            exit 1
          fi

      - name: Sync rebuilt fixture into dist (chain succeeded)
        if: steps.chain.outcome == 'success'
        run: |
          # Sync the rebuilt fixture, chain status, and fit output into dist for Pages
          cp data/fixtures/current/comparison-sources-data.json dist/modules/comparison-sources-data.json
          cp output/comparison-chain-status.json dist/modules/comparison-chain-status.json 2>/dev/null || true
          cp app/trade-value-chart/assets/adjustment-inputs.json dist/assets/adjustment-inputs.json 2>/dev/null || true

      # Non-blocking (decision consol-nonblocking-001, Jeremy 2026-10-07): the
      # site serves the fixture, not public.consolidated_values, so a failed
      # Supabase write must not hold the Pages deploy. The writer still fails
      # closed internally (nothing partial lands); its outcome is recorded as
      # the monitored check consolidated_values_write below, red on failure.
      # Guard: tests/test_rebuild_chain_consolidation_nonblocking.py.
      - name: Build consolidation layer (JEG-324)
        id: consolidate
        if: steps.chain.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Build consolidation rows from the just-baked fixture and upsert to Supabase.
          python3 pipelines/build_consolidated_values.py --write-supabase
          echo "Consolidation layer updated in Supabase"

      - name: Record consolidated_values check
        if: always() && steps.consolidate.outcome != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id consolidated_values_write --owner rebuild-chain.yml --outcome "${{ steps.consolidate.outcome }}"

      - name: Publish chain status only (chain failed)
        if: steps.chain.outcome == 'failure'
        run: |
          # The chain fails closed, so the fixture on disk can hold promotions from
          # sources that passed while others were held, with fit and adjusted
          # sections skipped. Never publish that partial fixture: publish only the
          # status, so a red chain is visible on the monitor.
          cp output/comparison-chain-status.json dist/modules/comparison-chain-status.json 2>/dev/null \
            || echo "No chain status was written; nothing to publish."

      - name: Refresh GitHub Actions status (JEG-109)
        # Runs on every chain execution (success or failure) so the dashboard's
        # workflow-health section stays fresh. Unauthenticated API: 1 workflow
        # list call + 1 recent-runs call per workflow ~= 17 calls per run,
        # well under the 60/hr limit -- but combined with the other hourly
        # jobs a 403 refresh failure is expected from time to time.
        # On refresh failure the fallback MUST restore the last committed
        # artifact, never write an empty one: tests.test_published_surfaces
        # requires workflows >= 1, and the old empty fallback
        # (workflows: [] + 'refresh failed') failed `make validate` on every
        # subsequent Pages deploy (observed 2026-10-06: 11:00 UTC 403 pushed
        # the empty artifact to main, blocking all production updates until
        # repaired). The file is committed, so leaving it untouched keeps the
        # last valid bytes and the Commit step's git add pathspec still
        # matches.
        if: always()
        run: |
          python3 pipelines/build_github_actions_status.py \
            --out dist/modules/github-actions.json \
            || { echo "WARNING: GitHub Actions status refresh failed (likely API rate limit); keeping the last committed artifact." >&2; git checkout -- dist/modules/github-actions.json; }

      - name: Commit and push if changed
        id: push
        # A failed "Run import health check" step fails the job before the
        # chain runs, but the refreshed github-actions.json (JEG-109; the Refresh
        # step runs unconditionally) and the red health artifact must still
        # reach the monitor -- without this, the dashboard's workflow-health
        # card goes stale while the gate is red (2026-10-06: false
        # failing-streak badge on the health-artifacts workflow). Publish even
        # when an earlier step failed. The failure branch below stages ONLY
        # status/health files, never the fixture, so a red gate can never
        # promote data.
        if: always()
        env:
          CHAIN_OUTCOME: ${{ steps.chain.outcome }}
          BAKE_OUTCOME: ${{ steps.bake.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHAIN_OUTCOME" = "success" ]; then
            git add data/fixtures/current/comparison-sources-data.json \
                    dist/modules/comparison-sources-data.json \
                    dist/modules/source-import-health.json \
                    dist/modules/comparison-chain-status.json \
                    dist/modules/github-actions.json \
                    dist/assets/adjustment-inputs.json \
                    app/trade-value-chart/assets/adjustment-inputs.json \
                    output/source-import-health.json \
                    output/comparison-chain-status.json || true
            # Week history: the saved weeks and their index (built against
            # this fixture by the chain's make sync).
            git add data/history || true
            # The DDF legs the published espn/cbsros/razzball sections were
            # built from (held sources' legs were restored by the chain). An
            # unchanged rebuild leaves the files untouched (write_leg_json), so
            # this adds only new vintages / real changes
            # (GAP-RAZZBALL-REFRESH-FOLLOWUPS (1)).
            git add data/ddf-two-tier || true
            # The baked ESPN anchor ships only here: after the chain and its
            # `make validate` passed on it. Unchanged when no bake ran (or a
            # failed bake was restored), so these adds are then no-ops.
            git add data/inputs/espn_projections.csv \
                    data/fixtures/current/players.json \
                    data/fixtures/current/players.naming-manifest.json || true
            MESSAGE="Automated comparison rebuild (GitHub Actions)"
            if [ "${BAKE_OUTCOME:-}" = "success" ]; then MESSAGE="$MESSAGE + ESPN anchor bake"; fi
          else
            # Chain failed: stage ONLY the status and health files, never the fixture.
            git add dist/modules/source-import-health.json \
                    dist/modules/comparison-chain-status.json \
                    dist/modules/github-actions.json \
                    output/source-import-health.json \
                    output/comparison-chain-status.json || true
            MESSAGE="Automated chain status (chain failed; fixture not updated)"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "$MESSAGE"
            # JEG-299: main is hot (30-min health pushes + lane merges move it
            # during the chain run). Rebase onto the latest tip before pushing
            # so a non-fast-forward rejection doesn't silently drop the rebuild.
            # --autostash: a failed chain leaves the partial fixture unstaged
            # by design; stash it across the rebase instead of refusing.
            # On rebase conflict: abort and fail loudly -- never force-push.
            git pull --rebase --autostash origin main || {
              echo "::error::Rebase onto origin/main failed; rebuild output preserved in run artifacts, manual push needed."
              git rebase --abort || true
              exit 1
            }
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      # JEG-274: GitHub's no-cascade rule means pushes made with GITHUB_TOKEN
      # do not trigger `push`-event workflows, so the Pages deploy ("Deploy
      # dashboard", on: push: branches: [main]) never fires for chain commits.
      # Explicitly dispatch the deploy workflow via workflow_dispatch, which IS
      # honored when triggered via GITHUB_TOKEN (the documented exception).
      # This only fires for chain commits (always GITHUB_TOKEN-originated), so
      # it cannot double-fire on PAT pushes — those never run this workflow.
      - name: Trigger Pages deploy after chain push (JEG-274)
        # !cancelled(): once the fixture is on main it is deployed, whatever
        # an earlier non-publishing step (e.g. the consolidation write) did.
        if: ${{ !cancelled() && steps.push.outputs.pushed == 'true' }}
        run: |
          # Dispatch via API directly (not gh CLI) for better error visibility.
          # JEG-274: gh workflow run exits 1 with GITHUB_TOKEN; curl gives us
          # the actual HTTP status and response body for debugging.
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/dispatch_resp.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "Dispatch attempt $attempt: HTTP $HTTP_CODE"
            cat /tmp/dispatch_resp.json
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Pages deploy dispatched successfully"
              exit 0
            fi
            echo "Dispatch attempt $attempt failed (HTTP $HTTP_CODE); retrying in 20s..."
            sleep 20
          done
          echo "::error::Pages dispatch failed 3 times (last HTTP $HTTP_CODE)"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload review artifacts (JEG-113)
        # The review JSONs are gitignored, so a bare "hold" in the log says
        # nothing about WHY. Upload them on every run so the failing checks
        # and review rows are inspectable from the workflow run page.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-reviews
          path: output/reviewed/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job if the chain failed
        if: steps.chain.outcome == 'failure'
        run: |
          echo "Comparison chain failed (fail-closed). Status published; fixture not updated."
          exit 1

      # JEG-137 R10: record this run's started_at and cron_at (null for dispatch)
      # into comparison-chain-status.json so the deadline checker can see whether
      # the chain started when it should have.
      - name: Record workflow run (JEG-137 R10)
        if: always()
        env:
          CHAIN_OUTCOME_FOR_RECORD: ${{ steps.chain.outcome }}
        run: |
          STATUS="success"
          if [ "$CHAIN_OUTCOME_FOR_RECORD" = "failure" ]; then STATUS="failure"; fi
          python3 pipelines/lib/record_workflow_run.py \
            --workflow "Rebuild comparison chain" \
            --started-at "${WORKFLOW_STARTED_AT:-$(date -u +%FT%TZ)}" \
            --cron "" \
            --run-id "$GITHUB_RUN_ID" \
            --status "$STATUS" \
            --output output/comparison-chain-status.json

      # Monitoring: record this run in Supabase monitoring.check_observations,
      # red or green. A run that never happens is flagged `missed` by the
      # evaluator. Never fails the job. Declared in config/monitoring_coverage.json.
      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        # Held sources (per-source-promotion-001) are recorded as their own
        # checks: rebuild_chain_source_held (amber) and
        # rebuild_chain_source_held_stale (red, held two or more weeks).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHAIN_OUTCOME: ${{ steps.chain.outcome }}
        run: |
          python3 pipelines/record_monitor_check.py --check-id rebuild_chain --owner rebuild-chain.yml --outcome "${{ job.status }}"
          python3 pipelines/record_chain_holds.py --owner rebuild-chain.yml --chain-outcome "$CHAIN_OUTCOME"
