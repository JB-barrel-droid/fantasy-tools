name: Rebuild comparison chain

# Fully independent of Muse. Runs the import -> health -> comparison rebuild
# chain on GitHub's infra using repo secrets.
#
# Required secrets (set in repo Settings > Secrets and variables > Actions):
#   SUPABASE_URL          e.g. https://iskiybsimubiujwuchsl.supabase.co
#   SUPABASE_SERVICE_KEY  the Supabase service_role key
#
# The GITHUB_TOKEN is automatic; no setup needed.

on:
  # JEG-76: no fixed schedule. The hourly source-vintage-check.yml dispatches
  # this workflow only when DB content vintage differs from fixture vintage.
  # JEG-109's status-refresh step still runs on every dispatched execution.
  workflow_dispatch:
    # Manual trigger from the Actions tab.
    inputs:
      # JEG-269: source-vintage-check.yml dispatches with
      # -f source="source-vintage-check". The dispatches API rejects inputs
      # that are not declared here (HTTP 422: workflow does not have the
      # input), so this must stay in sync with the caller's -f/--field args.
      source:
        description: "Which dispatcher triggered this run (provenance)"
        required: false
        default: "manual"

permissions:
  contents: write  # needed to commit and push the rebuilt fixture
  actions: write  # needed to dispatch pages.yml via API (JEG-274)

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the promote step's git-revision stamping works.
          fetch-depth: 0

      # JEG-137 R10: capture the run start time as early as possible so the
      # scheduler-slip measurement (started_at - cron_at) reflects when the
      # run began, not when the recording step runs at the end of the job.
      - name: Record workflow start time (JEG-137 R10)
        run: echo "WORKFLOW_STARTED_AT=$(date -u +%FT%TZ)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          # The pipelines import `sbclient`, which normally uses Muse's
          # credential system. Outside Muse, shim it with the env-based client.
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py 2>/dev/null || \
            (mkdir -p /tmp/gh_shim && cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py)
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Determine NFL week
        id: week
        run: echo "nfl_week=$(python3 pipelines/nfl_week.py)" >> $GITHUB_OUTPUT

      - name: Import fresh snapshots from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # import_supabase_references.py takes --source (one of the six),
          # not --nfl-week. Import each source explicitly.
          for src in fantasycalc usatoday fantasypros espn cbs cbsros razzball; do
            python3 pipelines/import_supabase_references.py --source "$src"
          done

      - name: Run import health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipelines/verify_import_health.py --nfl-week ${{ steps.week.outputs.nfl_week }}
          cp output/source-import-health.json dist/modules/source-import-health.json

      - name: Rebuild comparison chain (if fixture stale)
        id: chain
        # The chain fails closed: a review hold exits non-zero. Do not stop the
        # job here, because the chain status must still reach the monitor when it
        # is red (JEG-8). The job is failed explicitly by the last step.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipelines/rebuild_comparison_chain.py --nfl-week ${{ steps.week.outputs.nfl_week }}

      - name: Sync rebuilt fixture into dist (chain succeeded)
        if: steps.chain.outcome == 'success'
        run: |
          # Sync the rebuilt fixture, chain status, and fit output into dist for Pages
          cp data/fixtures/current/comparison-sources-data.json dist/modules/comparison-sources-data.json
          cp output/comparison-chain-status.json dist/modules/comparison-chain-status.json 2>/dev/null || true
          cp app/trade-value-chart/assets/adjustment-inputs.json dist/assets/adjustment-inputs.json 2>/dev/null || true

      - name: Publish chain status only (chain failed)
        if: steps.chain.outcome == 'failure'
        run: |
          # The chain fails closed, so the fixture on disk can hold promotions from
          # sources that passed while others were held, with fit and adjusted
          # sections skipped. Never publish that partial fixture: publish only the
          # status, so a red chain is visible on the monitor.
          cp output/comparison-chain-status.json dist/modules/comparison-chain-status.json 2>/dev/null \
            || echo "No chain status was written; nothing to publish."

      - name: Refresh GitHub Actions status (JEG-109)
        # Runs on every chain execution (success or failure) so the dashboard's
        # workflow-health section stays fresh. Unauthenticated API: 7 workflows
        # x 6 calls each = ~42 calls, well under the 60/hr limit.
        # MUST always write the file: the commit step's `git add` fails entirely
        # if a pathspec matches nothing, which would unstage everything else.
        if: always()
        run: |
          python3 pipelines/build_github_actions_status.py \
            --out dist/modules/github-actions.json \
            || python3 -c "
          import json, datetime
          json.dump({'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'repo': 'JB-barrel-droid/fantasy-tools', 'workflows': [],
                     'coverage_gaps': [], 'error': 'refresh failed',
                     'summary': {'total_workflows': 0}}, 
                    open('dist/modules/github-actions.json','w'), indent=2)
          "

      - name: Commit and push if changed
        id: push
        env:
          CHAIN_OUTCOME: ${{ steps.chain.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHAIN_OUTCOME" = "success" ]; then
            git add data/fixtures/current/comparison-sources-data.json \
                    dist/modules/comparison-sources-data.json \
                    dist/modules/source-import-health.json \
                    dist/modules/comparison-chain-status.json \
                    dist/modules/github-actions.json \
                    dist/assets/adjustment-inputs.json \
                    app/trade-value-chart/assets/adjustment-inputs.json \
                    output/source-import-health.json \
                    output/comparison-chain-status.json || true
            MESSAGE="Automated comparison rebuild (GitHub Actions)"
          else
            # Chain failed: stage ONLY the status and health files, never the fixture.
            git add dist/modules/source-import-health.json \
                    dist/modules/comparison-chain-status.json \
                    dist/modules/github-actions.json \
                    output/source-import-health.json \
                    output/comparison-chain-status.json || true
            MESSAGE="Automated chain status (chain failed; fixture not updated)"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "$MESSAGE"
            # JEG-299: main is hot (30-min health pushes + lane merges move it
            # during the chain run). Rebase onto the latest tip before pushing
            # so a non-fast-forward rejection doesn't silently drop the rebuild.
            # --autostash: a failed chain leaves the partial fixture unstaged
            # by design; stash it across the rebase instead of refusing.
            # On rebase conflict: abort and fail loudly -- never force-push.
            git pull --rebase --autostash origin main || {
              echo "::error::Rebase onto origin/main failed; rebuild output preserved in run artifacts, manual push needed."
              git rebase --abort || true
              exit 1
            }
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      # JEG-274: GitHub's no-cascade rule means pushes made with GITHUB_TOKEN
      # do not trigger `push`-event workflows, so the Pages deploy ("Deploy
      # dashboard", on: push: branches: [main]) never fires for chain commits.
      # Explicitly dispatch the deploy workflow via workflow_dispatch, which IS
      # honored when triggered via GITHUB_TOKEN (the documented exception).
      # This only fires for chain commits (always GITHUB_TOKEN-originated), so
      # it cannot double-fire on PAT pushes — those never run this workflow.
      - name: Trigger Pages deploy after chain push (JEG-274)
        if: steps.push.outputs.pushed == 'true'
        run: |
          # Dispatch via API directly (not gh CLI) for better error visibility.
          # JEG-274: gh workflow run exits 1 with GITHUB_TOKEN; curl gives us
          # the actual HTTP status and response body for debugging.
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/dispatch_resp.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "Dispatch attempt $attempt: HTTP $HTTP_CODE"
            cat /tmp/dispatch_resp.json
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Pages deploy dispatched successfully"
              exit 0
            fi
            echo "Dispatch attempt $attempt failed (HTTP $HTTP_CODE); retrying in 20s..."
            sleep 20
          done
          echo "::error::Pages dispatch failed 3 times (last HTTP $HTTP_CODE)"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload review artifacts (JEG-113)
        # The review JSONs are gitignored, so a bare "hold" in the log says
        # nothing about WHY. Upload them on every run so the failing checks
        # and review rows are inspectable from the workflow run page.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-reviews
          path: output/reviewed/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job if the chain failed
        if: steps.chain.outcome == 'failure'
        run: |
          echo "Comparison chain failed (fail-closed). Status published; fixture not updated."
          exit 1

      # JEG-137 R10: record this run's started_at and cron_at (null for dispatch)
      # into comparison-chain-status.json so the deadline checker can see whether
      # the chain started when it should have.
      - name: Record workflow run (JEG-137 R10)
        if: always()
        env:
          CHAIN_OUTCOME_FOR_RECORD: ${{ steps.chain.outcome }}
        run: |
          STATUS="success"
          if [ "$CHAIN_OUTCOME_FOR_RECORD" = "failure" ]; then STATUS="failure"; fi
          python3 pipelines/lib/record_workflow_run.py \
            --workflow "Rebuild comparison chain" \
            --started-at "${WORKFLOW_STARTED_AT:-$(date -u +%FT%TZ)}" \
            --cron "" \
            --run-id "$GITHUB_RUN_ID" \
            --status "$STATUS" \
            --output output/comparison-chain-status.json
