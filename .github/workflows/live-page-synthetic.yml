name: Live page synthetic gate

# JEG-136: scheduled live-page check from CI.
# JEG-263 fix: the expected build tag is computed from HEAD's commit time
# (the same formula `make sync` stamps in the deploy pipeline). The old step
# grepped the tag from the repo's committed dist/index.html, but the deploy
# pipeline rebuilds dist/ in CI and never commits it back -- the committed
# copy's tag is stale by construction, so the gate failed on every run.
on:
  schedule:
    # Daily at 06:00 UTC (1:00 AM CDT) - runs after the chart build
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (defaults to production)"
        required: false
        default: ""
      expected_build:
        description: "Expected build tag (defaults to computing from HEAD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: tests/rendered_gate
        run: npm ci

      - name: Install Playwright browsers
        run: npx --prefix tests/rendered_gate playwright-core install --with-deps chromium

      - name: Compute expected build tag(s) from HEAD
        id: build-tag
        run: |
          # JEG-263: the build tag is deterministic per commit: tv-YYYYMMDD-HHMM-<sha>
          # from HEAD's commit time -- the exact formula in
          # pipelines/sync_dashboard_artifacts.py::build_tag(). Grep the committed
          # dist/index.html is stale by construction (deploy rebuilds dist in CI
          # and never commits it back), so compute it here instead.
          if [ -n "${{ github.event.inputs.expected_build }}" ]; then
            {
              echo "tags<<EOF"
              echo "${{ github.event.inputs.expected_build }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            tag() { git show -s --format=%cd-%h "--date=format:%Y%m%d-%H%M" "$1" | sed 's/^/tv-/'; }
            {
              echo "tags<<EOF"
              tag HEAD
              # Deploy race: the live page may still serve the previous commit's
              # build while a deploy is in flight. Accepting HEAD~1 keeps the
              # gate from false-failing on that window; anything older still fails.
              tag HEAD~1
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Determine URL to test
        id: url-to-test
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            echo "url=${{ github.event.inputs.url }}" >> $GITHUB_OUTPUT
          else
            echo "url=https://jb-barrel-droid.github.io/fantasy-tools/" >> $GITHUB_OUTPUT
          fi

      - name: Run live page synthetic gate
        id: gate
        run: |
          set +e
          EXPECTED_ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] && EXPECTED_ARGS="$EXPECTED_ARGS --expected-build $t"
          done <<< "${{ steps.build-tag.outputs.tags }}"
          # shellcheck disable=SC2086
          node tests/rendered_gate/live.mjs \
            --url "${{ steps.url-to-test.outputs.url }}" \
            $EXPECTED_ARGS \
            --out output/live-page-synthetic.json
          GATE_RC=$?
          set -e
          echo "gate_rc=$GATE_RC" >> $GITHUB_OUTPUT

      - name: Gate self-test (must be able to fail)
        run: |
          # A gate that cannot fail is worse than no gate: require live.mjs to
          # reject a bogus expected tag against the same live page.
          node tests/rendered_gate/live.mjs --self-test "${{ steps.url-to-test.outputs.url }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-page-synthetic-results
          path: output/live-page-synthetic.json
          retention-days: 7

      - name: Publish to monitor (if artifact exists)
        if: always()
        run: |
          if [ -f output/live-page-synthetic.json ]; then
            echo "Live page synthetic results:"
            cat output/live-page-synthetic.json
          else
            echo "No results file generated - gate may have failed early"
            # Create a failure artifact for the monitor
            echo '{"generatedAt":"'"$(date -Iseconds)"'","error":"Gate failed to produce results","passed":false}' > output/live-page-synthetic.json
          fi

      - name: Check gate result
        run: |
          if [ ${{ steps.gate.outputs.gate_rc }} -ne 0 ]; then
            echo "Live page gate FAILED"
            exit 1
          fi
          echo "Live page gate PASSED"

  # This job runs after the main gate to create the monitor bridge artifact
  monitor-bridge:
    needs: live-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: live-page-synthetic-results
          path: output/

      - name: Validate and prepare monitor artifact
        run: |
          if [ -f output/live-page-synthetic.json ]; then
            # Validate JSON is well-formed
            python3 -c "import json; json.load(open('output/live-page-synthetic.json'))"
            echo "Artifact is valid JSON"

            # Add run metadata
            python3 << 'EOF'
          import json
          from datetime import datetime

          with open('output/live-page-synthetic.json') as f:
              data = json.load(f)

          # Add run metadata
          data['run_url'] = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          data['run_id'] = '${{ github.run_id }}'

          # Determine freshness (36 hour window)
          # The producer (tests/rendered_gate/live.mjs) writes camelCase
          # `generatedAt`; legacy fallback paths write snake_case. Accept both;
          # neither present means a corrupt artifact -- fail, never guess.
          raw_ts = data.get('generatedAt', data.get('generated_at'))
          if not raw_ts:
              raise SystemExit('live-page-synthetic.json has neither generatedAt nor generated_at')
          generated_at = datetime.fromisoformat(str(raw_ts).replace('Z', '+00:00'))
          now = datetime.now(generated_at.tzinfo)
          age_hours = (now - generated_at).total_seconds() / 3600

          # Check if result is fresh (within 36 hours)
          is_fresh = age_hours <= 36

          # Determine status
          passed = data.get('passed', len(data.get('problems', [])) == 0)
          is_stale = not is_fresh

          data['monitor'] = {
              'freshness': {
                  'age_hours': round(age_hours, 1),
                  'is_fresh': is_fresh,
                  'threshold_hours': 36
              },
              'status': 'green' if (passed and is_fresh) else ('stale' if is_stale else 'red')
          }

          with open('output/live-page-synthetic.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Status: {data['monitor']['status']}")
          print(f"Age: {age_hours:.1f} hours")
          print(f"Passed: {passed}")
          EOF
          else
            echo "No artifact found - creating failure record"
            echo '{"generated_at":"'"$(date -Iseconds)"'","passed":false,"error":"No artifact","monitor":{"status":"red"}}' > output/live-page-synthetic.json
          fi

      - name: Upload monitor artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-page-synthetic-monitor
          path: output/live-page-synthetic.json
          retention-days: 7
