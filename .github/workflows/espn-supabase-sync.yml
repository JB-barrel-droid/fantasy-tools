name: ESPN scrape to Supabase

# Scrapes fresh ESPN projections and saves them to Supabase.
# This closes the automation gap where ESPN data was only updated
# via local cron + manual save step.
#
# Runs daily at 06:30 CT (after the local scraper would have run,
# as a backup; primary path is this Action).

on:
  # JEG-285: cron disabled 2026-10-03, now triggered by Supabase pg_cron
#   schedule:
#     # Daily at 11:30 UTC (06:30 CT)
#     - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and resolve identities, but do not write to Supabase"
        type: boolean
        default: false
      probe_fp:
        description: "Set by source-probe.yml: the fingerprint to acknowledge on success (blank = manual run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write  # dispatch the rebuild chain after a probe-driven change

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JEG-137 R10: capture the run start time as early as possible so the
      # scheduler-slip measurement (started_at - cron_at) reflects when the
      # run began, not when the recording step runs at the end of the job.
      - name: Record workflow start time (JEG-137 R10)
        run: echo "WORKFLOW_STARTED_AT=$(date -u +%FT%TZ)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py 2>/dev/null || true
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Scrape ESPN projections
        run: |
          # JEG-102: fail closed. A scraper failure, a missing CSV or a suspiciously
          # small CSV fails the job. A zero exit with no CSV would mean "payload
          # unchanged", which CI cannot establish (no stored hash), so it is an error.
          set -euo pipefail
          rm -f /tmp/espn_projections.csv /tmp/espn_meta.json
          python3 pipelines/pull_espn_projections.py --out /tmp/espn_projections.csv --meta /tmp/espn_meta.json
          test -s /tmp/espn_projections.csv || { echo "::error::ESPN scrape exited 0 but produced no CSV"; exit 1; }
          rows=$(( $(wc -l < /tmp/espn_projections.csv) - 1 ))
          if [ "$rows" -lt 100 ]; then
            echo "::error::ESPN scrape produced only ${rows} rows (floor is 100)"
            exit 1
          fi
          echo "ESPN acquired ${rows} rows"
          echo "ESPN scrape: acquired ${rows} rows" >> "$GITHUB_STEP_SUMMARY"

      - name: Save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          flag=""
          if [ "${DRY_RUN:-}" = "true" ]; then flag="--dry-run"; fi
          python3 pipelines/save_espn_cbs_references.py --source espn $flag \
            --espn-csv /tmp/espn_projections.csv \
            --espn-meta /tmp/espn_meta.json

      # The daily ESPN anchor bake (rebuild-chain.yml, bake_players=true)
      # takes this exact CSV: the table drops columns the bake needs (ESPN's
      # team, the eligible flag, display name), so it cannot be rebuilt from
      # Supabase alone. tests/test_rebuild_chain_bake.py pins this step.
      - name: Upload saved ESPN CSV for the anchor bake
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: espn-projections
          path: /tmp/espn_projections.csv
          if-no-files-found: error
          retention-days: 7

      # JEG-137 R10: record started_at and cron_at for the deadline checker.
      - name: Record workflow run (JEG-137 R10)
        if: always()
        run: |
          STATUS="success"
          if [ "${{ job.status }}" = "failure" ]; then STATUS="failure"; fi
          python3 pipelines/lib/record_workflow_run.py \
            --workflow "ESPN scrape to Supabase" \
            --started-at "${WORKFLOW_STARTED_AT:-$(date -u +%FT%TZ)}" \
            --cron "30 11 * * *" \
            --run-id "$GITHUB_RUN_ID" \
            --status "$STATUS" \
            --output output/comparison-chain-status.json

      - name: Commit scraper updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit any scraper improvements, not the data (data lives in Supabase)
          git add pipelines/pull_espn_projections.py 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No scraper changes to commit."
          else
            git commit -m "Automated ESPN scraper update (GitHub Actions)"
            # Push-race guard (2026-10-03): automated pushers (the 30-min health
            # cron, other workflows) can land commits on main between this job's
            # checkout and this push. Rebase onto the latest main first so the
            # push stays fast-forward instead of failing non-fast-forward.
            # --autostash: this step deliberately leaves unstaged changes behind
            # (e.g. the held-back partial fixture on a red chain); stash them
            # across the rebase instead of refusing.
            git pull --rebase --autostash origin main
            git push
          fi

      # Monitoring: record this run in Supabase monitoring.check_observations,
      # red or green. A run that never happens is flagged `missed` by the
      # evaluator. Never fails the job. Declared in config/monitoring_coverage.json.
      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id espn_supabase_sync --owner espn-supabase-sync.yml --outcome "${{ job.status }}"

      # Refresh cadence (source-probe.yml, pipelines/source_probe.py): acknowledge
      # the probe fingerprint this run was dispatched for, so the probe stops
      # re-dispatching it, and run the rebuild chain when the content is new.
      # After the monitored-check step on purpose: an ack failure must not
      # record the ingest itself as failed.
      - name: Acknowledge probe fingerprint
        id: ack
        if: success() && github.event.inputs.probe_fp != '' && github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROBE_FP: ${{ github.event.inputs.probe_fp }}
        run: python3 pipelines/source_probe.py ack --supabase --source espn --fingerprint "$PROBE_FP"

      - name: Dispatch the rebuild chain on new content
        if: success() && steps.ack.outputs.new_content == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run rebuild-chain.yml -f source="source-probe-espn"
