name: FantasyCalc drift check and refresh

# JEG-426: drift DETECTION only. Compares live FantasyCalc values against the
# FantasyCalc data currently in Supabase (the system of record, freshly
# imported here).
#
# MANUAL ONLY since 2026-10-08 (producers lane): pg_cron job
# `trigger-fantasycalc-drift-live` and monitored check
# `fantasycalc_native_drift` are retired
# (supabase/migrations/producers_schedule_tidy_20261008.sql). The weekly
# producer (fantasycalc-weekly-save.yml, Tue + Fri) re-saves FantasyCalc before
# drift between saves can age past a few days, and drift is not wrong numbers
# (pre-launch: monitoring warns, it does not page). Dispatch by hand to ask
# "has FantasyCalc moved since the last save?".
#
# What this job no longer does (and why):
#   - It no longer runs check_fantasycalc_drift.py --trigger. That path wrote
#     the published fixture and served copies directly and pushed them to main,
#     skipping the rebuild chain's review gate and `make validate`. It was only
#     ever held back because the import-health step that followed it failed on
#     every run (no source manifests in a fresh checkout).
#   - It no longer runs refresh_fantasycalc_supabase.py, which writes Week 4
#     rows (hardcoded) with the publisher's raw number in `value` and no
#     bake_id -- the opposite of save_fantasycalc_references.py's contract.
# Refreshing FantasyCalc data is the weekly producer's job; publishing is the
# rebuild chain's. Drift is surfaced loudly so a human (or the producer) acts.
#
# Exit semantics: drift is a data state, not a job failure (JEG-412). The job
# fails only when the check itself cannot run.

on:
  workflow_dispatch:
  # Exercise the job on a branch before merging (records a real observation).
  push:
    branches: ["drift/**"]

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JEG-137 R10: capture the run start time as early as possible.
      - name: Record workflow start time (JEG-137 R10)
        run: echo "WORKFLOW_STARTED_AT=$(date -u +%FT%TZ)" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Import current FantasyCalc data from Supabase
        id: snap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipelines/import_supabase_references.py --source fantasycalc
          path=$(python3 - <<'EOF'
          import json, pathlib
          best = None
          for m in pathlib.Path("data/raw/sources/fantasycalc").glob("*/snapshot-manifest.json"):
              d = json.loads(m.read_text())
              key = str(d.get("pulled_at") or "")
              if best is None or key > best[0]:
                  best = (key, d.get("snapshot_path") or str(m.parent / "snapshot.json"), d.get("content_vintage"))
          print(best[1] if best else "")
          EOF
          )
          test -n "$path" && test -s "$path" || { echo "::error title=drift::no imported FantasyCalc snapshot"; exit 1; }
          echo "path=$path" >> $GITHUB_OUTPUT
          echo "::notice title=drift-baseline::$path"

      - name: Compare live FantasyCalc against Supabase
        id: drift
        run: |
          set +e
          python3 pipelines/check_fantasycalc_drift.py --snapshot "${{ steps.snap.outputs.path }}" | tee /tmp/drift.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> $GITHUB_OUTPUT
          head -1 /tmp/drift.log | sed "s/^/::notice title=drift-summary::/"
          case $rc in
            0) echo "FantasyCalc: no drift vs Supabase" >> "$GITHUB_STEP_SUMMARY" ;;
            1) grep -E "^  " /tmp/drift.log | head -10 | sed "s/^ */::warning title=drift-player::/"
               echo "FantasyCalc: DRIFT vs Supabase (refresh the weekly FantasyCalc save)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "FantasyCalc: drift check could not run (rc=$rc)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Fail only if the check itself failed
        if: steps.drift.outputs.rc != '0' && steps.drift.outputs.rc != '1'
        run: exit 1

      # JEG-137 R10: record started_at and cron_at for the deadline checker.
      - name: Record workflow run (JEG-137 R10)
        if: always()
        run: |
          STATUS="success"
          if [ "${{ job.status }}" = "failure" ]; then STATUS="failure"; fi
          python3 pipelines/lib/record_workflow_run.py \
            --workflow "FantasyCalc drift check and refresh" \
            --started-at "${WORKFLOW_STARTED_AT:-$(date -u +%FT%TZ)}" \
            --cron "manual" \
            --run-id "$GITHUB_RUN_ID" \
            --status "$STATUS" \
            --output output/comparison-chain-status.json
