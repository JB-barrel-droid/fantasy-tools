name: Razzball ROS scrape to Supabase

# Replaces Muse's razzball-projections-pull (daily 06:20 CT; disabled
# 2026-10-06, ops-ownership-001). Closes GAP-024 / GAP-030: no CI puller
# refreshed Razzball, so public.razzball_projections (a dashboard source the
# import-health gate grades fresh <= 2d, bad > 6d) aged silently.
#
#   pipelines/pull_razzball_ros.py   -> /tmp/razzball/snapshot.json (+ Muse-schema
#     razzball_projections.csv), fail closed with named codes (SOURCE_BLOCKED...);
#     vintage = Razzball's own page-stamp date, not the run date
#   pipelines/save_razzball_references.py -> public.razzball_projections
#     (grain player_key + razzball_snapshot_date: each day is a new vintage,
#      earlier vintages are never touched)
#
# Downstream: rebuild-chain.yml imports the new vintage from Supabase and
# source-vintage-check.yml dispatches it when the DB vintage moves, so the
# Razzball DDF leg/section refresh through the normal publish path.
#
# Scheduler owner: Supabase pg_cron `razzball-sync-live` (daily 11:20 UTC),
# supabase/migrations/razzball_sync_pg_cron.sql, dispatching mode=write.
# No `schedule:` here.
#
#   push to razzball/dry-*   -> --dry-run
#   push to razzball/write-* -> write
#   workflow_dispatch        -> dry unless mode=write

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or write"
        required: false
        default: "dry"
  push:
    branches: ["razzball/dry-*", "razzball/write-*"]

permissions:
  contents: read

concurrency:
  group: razzball-supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Resolve mode
        id: cfg
        run: |
          mode=dry
          case "${GITHUB_REF_NAME}" in razzball/write-*) mode=write;; esac
          [ "${{ github.event.inputs.mode }}" = "write" ] && mode=write
          echo "mode=$mode" >> $GITHUB_OUTPUT
          echo "::notice title=razzball::mode=$mode"

      - name: Scrape and save
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Outcome surfaced as check-run annotations (Actions logs are not
          # downloadable through every proxy).
          flag=""
          [ "${{ steps.cfg.outputs.mode }}" = "write" ] || flag="--dry-run"
          rc=0
          {
            python3 pipelines/pull_razzball_ros.py --out-dir /tmp/razzball &&
            python3 pipelines/save_razzball_references.py --snapshot /tmp/razzball/snapshot.json $flag
          } > /tmp/razzball.log 2>&1 || rc=$?
          cat /tmp/razzball.log
          level=notice; [ "$rc" = 0 ] || level=error
          tail -8 /tmp/razzball.log | cut -c1-900 | sed "s/^/::$level title=razzball rc=$rc::/"
          grep -h -m2 -E "^razzball vintage|^razzball [0-9]{4}-" /tmp/razzball.log | cut -c1-600 | sed "s/^/::notice title=razzball pull::/" || true
          # Named codes from the puller: SOURCE_BLOCKED (bot wall / non-200),
          # SOURCE_LAYOUT, SOURCE_TRUNCATED, PPG_GATE; SYNC_FAILED = the saver.
          code=SYNC_FAILED
          pulled=$(grep -o "RAZZBALL PULL FAILED \[[A-Z_]*\]" /tmp/razzball.log | sed 's/.*\[\(.*\)\]/\1/' | head -1 || true)
          [ -n "$pulled" ] && code=$pulled
          echo "error_code=$code" >> $GITHUB_OUTPUT
          exit $rc

      - name: Keep the snapshot and Muse-schema CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: razzball-snapshot
          path: |
            /tmp/razzball/snapshot.json
            /tmp/razzball/razzball_projections.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Record the monitored check
        if: always() && steps.cfg.outputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OK: ${{ steps.sync.outcome == 'success' }}
          ERROR_CODE: ${{ steps.sync.outputs.error_code }}
        run: |
          python3 - <<'PY'
          import os, sbclient
          ok = os.environ["OK"] == "true"
          sbclient.rpc("monitoring_record_observation", {
              "p_check_id": "razzball_projections_sync",
              "p_ok": ok, "p_content_ok": ok,
              "p_error_code": None if ok else (os.environ.get("ERROR_CODE") or "SYNC_FAILED"),
              "p_scheduler_owner_id": "razzball-supabase-sync.yml",
          })
          print("recorded ok=%s" % ok)
          PY
