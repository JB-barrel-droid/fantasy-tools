name: Chain run feedback
on:
  workflow_run:
    workflows: [Rebuild comparison chain]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted default-branch tooling only; no observed branch code/artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Attribute completed run latency
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          mkdir -p output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" > output/feedback-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" --jq '[.[].jobs[]]' > output/feedback-jobs.json
          python3 -m pipelines.chain_run_feedback --run output/feedback-run.json --jobs output/feedback-jobs.json --output output/chain-run-feedback.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chain-run-feedback-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: output/*feedback*.json
          retention-days: 14
