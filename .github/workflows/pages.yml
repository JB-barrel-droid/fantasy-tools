name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make sync
      - id: validate
        run: make validate
        continue-on-error: true
      - name: Check if only monitor files changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qv '^dist/modules/'; then
            echo "product_changed=true" >> $GITHUB_OUTPUT
          else
            echo "product_changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Fail if product changed but validation failed
        if: steps.validate.outcome != 'success' && steps.changes.outputs.product_changed == 'true'
        run: |
          echo "Product files changed but validation failed. Blocking deploy."
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
