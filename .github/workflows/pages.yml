name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make sync
      # JEG-414 follow-up: generate dist/modules/supabase-config.json so the
      # monitor dashboard reads ops artifacts from Supabase directly instead
      # of needing bot commits to main. SUPABASE_ANON_KEY is the publishable
      # anon key — safe to embed in a served JSON file; add it as a GitHub
      # Actions secret (Settings → Secrets → New repository secret) before
      # merging. Without the secret the file is not written and the dashboard
      # falls back to the static stubs already committed in dist/modules/.
      - name: Write Supabase config for monitor dashboard
        if: ${{ secrets.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_ANON_KEY", "")
          if not url or not key:
              print("SUPABASE_URL or SUPABASE_ANON_KEY not set; skipping config")
              raise SystemExit(0)
          out = pathlib.Path("dist/modules/supabase-config.json")
          cfg = {"url": url, "anonKey": key}
          out.write_text(json.dumps(cfg))
          print(f"wrote {out} (url={url}, key=...{key[-6:]})")
          PY
      # JEG-133: validate runs on every commit (no path-dependent gating) and
      # is blocking. A red validate blocks the deploy on every push.
      - run: make validate
      - name: Rebuild source value lineage
        run: python3 pipelines/build_source_value_lineage.py
        continue-on-error: true
      # JEG-133: the rendered gate runs on every path that can reach
      # production, not only on PRs. Same invocation as preview.yml so a
      # direct push to main is gated identically to a PR. The step's
      # `exit $rc` makes the gate blocking; a failed gate stops the deploy.
      - name: Rendered gate (headless browser on the built dist)
        id: gate
        run: |
          npm ci --prefix tests/rendered_gate
          npx --prefix tests/rendered_gate playwright-core install --with-deps chromium
          set +e
          node tests/rendered_gate/gate.mjs dist --out rendered-gate.json
          rc=$?
          node tests/rendered_gate/bench_share_readout_harness.mjs dist
          rc2=$?
          node tests/rendered_gate/gate_flexibility.mjs dist
          rc3=$?
          set -e
          echo "page_errors=$(python3 -c "import json; print(len(json.load(open('rendered-gate.json'))['pageErrors']))")" >> "$GITHUB_OUTPUT"
          echo "pie_bad=$(python3 -c "import json; d=json.load(open('rendered-gate.json')); print(len(d['pieBad']), 'of', len(d['pie']))")" >> "$GITHUB_OUTPUT"
          if [ $rc2 -ne 0 ]; then echo "JEG-103 bench-share readout guard failed"; fi
          if [ $rc3 -ne 0 ]; then echo "JEG-135 rendered input sweep failed"; fi
          exit $rc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4