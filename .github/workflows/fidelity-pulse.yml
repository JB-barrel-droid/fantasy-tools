name: Fidelity pulse

# JEG-480: data fidelity, end to end, per source (pipelines/fidelity_pulse.py):
#   1. publisher site vs stored raw (independent re-read of the live page / API
#      vs the newest Supabase bake, every scoring and the 2-QB columns)
#   2. stored raw vs live chart (the deployed comparison-sources-data.json)
#   3. freshness (publisher posted a newer week than the chart shows)
#   4. reference vs engine (the JEG-479 value-check report, when published)
# Publishes dist/modules/fidelity-pulse.json (read by modules/status.html),
# appends the run to public.fidelity_runs / fidelity_divergences, and opens
# one `ops-alert` issue per red source (fidelity-red-<source>; closed when it
# clears). Red is a data state, not a job failure: this never blocks a deploy.
#
# Triggers:
#   pg_cron `fidelity-pulse-live` (every 3 h at :40) -> workflow_dispatch
#     (supabase/migrations/jeg480_fidelity_pulse.sql; no `schedule:` here)
#   after every rebuild-chain run (workflow_run), once its Pages deploy is done
#   push to pulse/**  -> run on that branch; publishes, writes and alerts nothing
#
# Politeness: one request per host per second, honest User-Agent; per run
# about 2 USA Today sitemaps + 1 article (via the Supabase relay when
# usatoday.com walls the runner), 1 FantasyPros sitemap + 1 article
# (+ up to 2 week-N+1 probes), 2 CBS article URLs, 6 FantasyCalc API lists,
# 4 ESPN API calls + 1 schedule call, 4 CBS rest-of-season pages, 4 Razzball pages.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "comma-separated: usatoday,fantasycalc,fantasypros,cbs,espn,cbsros,razzball (blank = all)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Rebuild comparison chain"]
    types: [completed]
    branches: [main]
  push:
    branches: ["pulse/**"]

permissions:
  contents: read  # JEG-1441: main writes use the environment-scoped App.
  actions: write   # dispatch trusted rebuild/source refresh workflows
  issues: write    # ops-alert issues

concurrency:
  group: fidelity-pulse
  cancel-in-progress: false

jobs:
  pulse:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    environment: main-writer
    runs-on: ubuntu-latest  # Isolate App credentials from shared runners.
    timeout-minutes: 40
    env: &writer-env
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps: &writer-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      # After a chain run, check the chart readers actually get: wait for the
      # Pages deploy the chain dispatched (it starts a few seconds after the
      # chain ends) before reading the live chart file.
      - name: Wait for the chain's Pages deploy
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 90
          for i in $(seq 1 40); do
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --limit 5 --json status \
                   --jq '[.[] | select(.status != "completed")] | length' || echo 0)
            [ "$busy" = "0" ] && { echo "no Pages deploy in flight"; exit 0; }
            echo "Pages deploy in flight ($busy); waiting"; sleep 30
          done
          echo "::warning title=fidelity pulse::Pages deploy still running after 20 min; checking the chart as served now"

      - name: Run the fidelity pulse
        id: pulse
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
        run: |
          args="--out output/fidelity-pulse.json"
          [ -n "$SOURCES" ] && args="$args --sources $SOURCES"
          [ "$IS_MAIN" = "true" ] && args="$args --write-supabase"
          python3 pipelines/fidelity_pulse.py $args | tee /tmp/pulse.log
          python3 - <<'PY'
          import json
          d = json.load(open("output/fidelity-pulse.json"))
          for r in d["sources"]:
              lvl = {"red": "error", "amber": "warning"}.get(r["status"], "notice")
              bad = [f"{k}={v['status']}" for k, v in r["stages"].items()]
              print(f"::{lvl} title=fidelity {r['source']}::{r['status']} ({', '.join(bad)})")
          PY
          { echo "## Fidelity pulse"; echo '```'; cat /tmp/pulse.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint main writer token
        id: main-writer
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned
        with:
          app-id: ${{ secrets.MAIN_WRITER_APP_ID }}
          private-key: ${{ secrets.MAIN_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish to the status page
        id: publish
        # A run limited to some sources must not replace the status page's
        # full report: on 2026-10-09 a razzball-only dispatch published a
        # 1-source file and test_published_surfaces failed main's validate
        # ("fidelity-pulse: sources=1 < 7") until the next full run.
        if: env.IS_MAIN == 'true' && (github.event_name != 'workflow_dispatch' || inputs.sources == '')
        env:
          MAIN_WRITER_TOKEN: ${{ steps.main-writer.outputs.token }}
          BRANCH_WRITER_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!python3 -B "$GITHUB_WORKSPACE/.github/scripts/main-writer-credential.py"'
          GIT_CONFIG_KEY_2: credential.useHttpPath
          GIT_CONFIG_VALUE_2: 'true'
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer fidelity-pulse-1 --phase "$1" --target "main"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            if [ "$#" -eq 0 ]; then set -- origin "HEAD:${GITHUB_REF:-refs/heads/main}"; fi
            git push "$@"
          }
          cp output/fidelity-pulse.json dist/modules/fidelity-pulse.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/modules/fidelity-pulse.json
          if git diff --cached --quiet; then echo "pushed=false" >> $GITHUB_OUTPUT; exit 0; fi
          release_guard stage
          git commit -m "Fidelity pulse (CI, JEG-480)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && release_push origin HEAD:main; then
              echo "pushed=true" >> $GITHUB_OUTPUT; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::could not push the fidelity pulse after 3 attempts"; exit 1

      - name: Retain deferred publication (fidelity-pulse-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-fidelity-pulse-1-${{ github.run_attempt }}
          path: output/release-publications/fidelity-pulse-1/
          if-no-files-found: ignore
          retention-days: 14

      - name: Rebuild the chain when a hold starts or ends
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("output/fidelity-pulse.json")).get("holds_changed") else 1)'; then
            python3 pipelines/source_probe.py dispatch-chain --reason "fidelity-hold"
          else
            echo "fidelity holds unchanged; no chain run needed"
          fi

      # JEG-520, Jeremy 2026-10-10 ("Amber, then re-sync"): a source whose
      # publisher changed after the stored save (ESPN) is amber, and its sync
      # runs now. The sync acknowledges the fingerprint it read and, on new
      # content, runs the chain, whose completion re-runs this pulse: only a
      # mismatch that survives the re-sync is red. `resyncs` dispatches one
      # request per publisher version (RESYNC_RETRY_HOURS), so this cannot loop.
      - name: Re-sync sources whose publisher changed since the save
        if: env.IS_MAIN == 'true' && hashFiles('output/fidelity-pulse.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 pipelines/fidelity_pulse.py --resync-dispatches output/fidelity-pulse.json > /tmp/resyncs.txt
          if [ ! -s /tmp/resyncs.txt ]; then echo "no re-sync requested"; exit 0; fi
          while read -r wf; do
            [ -n "$wf" ] || continue
            echo "re-sync: $wf"
            gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning title=fidelity re-sync::could not dispatch $wf"
          done < /tmp/resyncs.txt

      # Red sources only (wrong or missing numbers); amber stays on the page.
      # Owns only fidelity-* alert keys, so it never closes health-artifacts'
      # issues (and that run never closes these). Never fails the run.
      - name: Alert on red sources
        if: always() && env.IS_MAIN == 'true' && hashFiles('output/fidelity-pulse.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 pipelines/monitor_alerts.py --pulse output/fidelity-pulse.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-pulse
          path: output/fidelity-pulse.json
          if-no-files-found: warn
          retention-days: 14

      # Monitoring: record this run in Supabase monitoring.check_observations,
      # red or green (a red *source* is still a successful run). A run that
      # never happens is flagged `missed` by the evaluator. Never fails the job.
      # Declared in config/monitoring_coverage.json.
      - name: Record monitored check
        if: always() && env.IS_MAIN == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || github.event_name == 'schedule')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id fidelity_pulse --owner fidelity-pulse.yml --outcome "${{ job.status }}"

  pulse-branch:
    if: github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
      issues: write
    env: *writer-env
    steps: *writer-steps
