name: Player status history (Sleeper, daily)

# JEG-521 G4 (c): keep a daily Sleeper injury / roster-status history instead
# of overwriting it. pipelines/save_player_status_history.py ->
# public.player_status_history (one row per QB/RB/WR/TE per day). Summary in
# output/player-status-history.json is committed so the run is readable from
# the repo.
#
# Scheduler owner: Supabase pg_cron player-status-history-live (daily 13:10
# UTC) and player-status-history-sunday (16:30 UTC Sunday, game-day status),
# supabase/migrations/jeg521_g4_weekly_store_20261009.sql. No `schedule:`.
# workflow_dispatch is dry unless mode=write.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or write"
        required: false
        default: "dry"

permissions:
  contents: write
  actions: write  # dispatch the validated Pages build after the status commit

concurrency:
  group: player-status-history
  cancel-in-progress: false

jobs:
  save:
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # JEG-1363: display status must not wait for identity tests, a value bake
      # or the database history write. Same free/keyless source and scheduler.
      - name: Pull dated status for the page (no database access)
        id: status
        run: |
          python3 -m unittest tests.test_daily_player_status
          python3 pipelines/pull_player_status.py --raw-out /tmp/sleeper-status-raw.json

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Pull Sleeper and save the day's status
        id: history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          flags=(--dry-run)
          [ "${{ github.event.inputs.mode }}" = "write" ] && flags=()
          rc=0
          python3 pipelines/save_player_status_history.py --from-file /tmp/sleeper-status-raw.json "${flags[@]}" > /tmp/status.log 2>&1 || rc=$?
          cat /tmp/status.log
          level=notice; [ "$rc" = 0 ] || level=error
          tail -40 /tmp/status.log | tr '\n' ' ' | cut -c1-3000 | sed "s/^/::$level title=player status history rc=$rc::/"
          echo
          { echo "## Player status history"; echo '```'; tail -40 /tmp/status.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit dated page status and the successful history summary
        id: publish
        if: ${{ !cancelled() && github.event.inputs.mode == 'write' && steps.status.outcome == 'success' }}
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer player-status-history-1 --phase "$1" --target "${GITHUB_REF_NAME:-main}"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            git push "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inputs/player_status.json
          if [ "$HISTORY_OUTCOME" = "success" ]; then
            git add -f output/player-status-history.json  # output/ is gitignored
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            release_guard stage
            git commit -m "Dated Sleeper display status and history (JEG-1363)"
            git pull --no-rebase origin "${GITHUB_REF_NAME}"
            release_push origin "HEAD:${GITHUB_REF_NAME}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN push does not trigger pages.yml's push event. Deploy
      # only after publication to main; branch/dry runs never dispatch Pages.
      - name: Request validated Pages build for the new status
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.publish.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error --output /tmp/status-deploy.json \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Retain deferred publication (player-status-history-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-player-status-history-1-${{ github.run_attempt }}
          path: output/release-publications/player-status-history-1/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && github.event.inputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id player_status_history --owner player-status-history.yml --outcome "${{ job.status }}"
