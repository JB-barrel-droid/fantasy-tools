name: Player status history (Sleeper, daily)

# JEG-521 G4 (c): keep a daily Sleeper injury / roster-status history instead
# of overwriting it. pipelines/save_player_status_history.py ->
# public.player_status_history (one row per QB/RB/WR/TE per day). Summary in
# output/player-status-history.json is committed so the run is readable from
# the repo.
#
# Scheduler owner: Supabase pg_cron player-status-history-live (daily 13:10
# UTC) and player-status-history-sunday (16:30 UTC Sunday, game-day status),
# supabase/migrations/jeg521_g4_weekly_store_20261009.sql. No `schedule:`.
# workflow_dispatch is dry unless mode=write.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or write"
        required: false
        default: "dry"

permissions:
  contents: read  # JEG-1441: main writes use the environment-scoped App.

concurrency:
  group: player-status-history
  cancel-in-progress: false

jobs:
  save:
    if: github.ref == 'refs/heads/main'
    environment: main-writer
    runs-on: ubuntu-latest  # Isolate App credentials from shared runners.
    steps: &writer-steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Pull Sleeper and save the day's status
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          flag="--dry-run"
          [ "${{ github.event.inputs.mode }}" = "write" ] && flag=""
          rc=0
          python3 pipelines/save_player_status_history.py $flag > /tmp/status.log 2>&1 || rc=$?
          cat /tmp/status.log
          level=notice; [ "$rc" = 0 ] || level=error
          tail -40 /tmp/status.log | tr '\n' ' ' | cut -c1-3000 | sed "s/^/::$level title=player status history rc=$rc::/"
          echo
          { echo "## Player status history"; echo '```'; tail -40 /tmp/status.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Mint main writer token
        id: main-writer
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.mode == 'write' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned
        with:
          app-id: ${{ secrets.MAIN_WRITER_APP_ID }}
          private-key: ${{ secrets.MAIN_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit the run summary
        if: github.event.inputs.mode == 'write'
        env:
          MAIN_WRITER_TOKEN: ${{ steps.main-writer.outputs.token }}
          BRANCH_WRITER_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!python3 -B "$GITHUB_WORKSPACE/.github/scripts/main-writer-credential.py"'
          GIT_CONFIG_KEY_2: credential.useHttpPath
          GIT_CONFIG_VALUE_2: 'true'
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer player-status-history-1 --phase "$1" --target "${GITHUB_REF_NAME:-main}"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            if [ "$#" -eq 0 ]; then set -- origin "HEAD:${GITHUB_REF:-refs/heads/main}"; fi
            git push "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/player-status-history.json  # output/ is gitignored
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            release_guard stage
            git commit -m "Player status history: daily snapshot (JEG-521 G4, GitHub Actions)"
            git pull --rebase --autostash origin main
            release_push
          fi

      - name: Retain deferred publication (player-status-history-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-player-status-history-1-${{ github.run_attempt }}
          path: output/release-publications/player-status-history-1/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && github.event.inputs.mode == 'write'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id player_status_history --owner player-status-history.yml --outcome "${{ job.status }}"

  save-branch:
    if: github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps: *writer-steps
