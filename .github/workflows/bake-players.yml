name: Bake players.json (non-Mac producer)

# JEG-392 / ARCH-013: rebuild data/fixtures/current/players.json without the
# Mac. Every bake input is either committed (data/inputs/*) or read from
# Supabase, the system of record. CBS ROS and Razzball come through the same
# path as the chain's bake (rebuild-chain.yml): import_supabase_references.py
# writes the latest snapshot and projection_identity.py picks the file the
# chain builds from. A bake from any other file (the old
# separate CBS ROS re-export from Supabase) carries a different cbsros_snapshot_id,
# so the next chain run would hold CBS ROS and re-bake (GAP-BAKE-ON-CHANGE).
#
# Trigger: push to a bake/** branch (the result is committed back to that
# branch for review and merges through the normal gated path), or manual
# dispatch from main (commits to a fresh bake/<run_id> branch). Never pushes
# to main: main only changes through a reviewed merge, and pages.yml's
# `make validate` gate still decides whether anything deploys.
#
# This is the manual, review-branch path. The daily ESPN anchor refresh that
# lands on main is rebuild-chain.yml with bake_players=true (pg_cron
# rebuild-chain-bake-live): it bakes from the latest scrape's CSV and pushes
# only after the chain's `make validate` passes.

on:
  push:
    branches: ["bake/**"]
    paths-ignore:
      - "data/fixtures/current/players.json"
      - "data/fixtures/current/players.naming-manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-players-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The headless render tests in `make validate` need a browser. Without
      # one they skipped and validate passed with them unrun (until
      # 2026-10-08). RENDER_TESTS_REQUIRED=1 makes a missing browser or build
      # an error for every later step instead of a silent skip.
      - name: Browser for the render tests
        run: |
          python3 -m pip install --quiet playwright==1.49.1
          python3 -m playwright install --with-deps chromium
          echo "RENDER_TESTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      # Same inputs as the chain's bake: the snapshots the importer writes
      # (latest saved vintage) and the committed ESPN anchor, chosen by
      # projection_identity.py decide (forced: this workflow always bakes).
      - name: Import CBS ROS and Razzball snapshots from Supabase
        id: inputs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python3 pipelines/import_supabase_references.py --source cbsros
          python3 pipelines/import_supabase_references.py --source razzball
          python3 pipelines/projection_identity.py decide --force true --espn-csv data/inputs/espn_projections.csv | tee /tmp/decide.log

      - name: Bake players.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CBSROS_SNAPSHOT: ${{ steps.inputs.outputs.cbsros_snapshot }}
          RAZZBALL_SNAPSHOT: ${{ steps.inputs.outputs.razzball_snapshot }}
        run: |
          set -euo pipefail
          test -n "$CBSROS_SNAPSHOT" && test -n "$RAZZBALL_SNAPSHOT"
          python3 pipelines/bake_players.py --cbsros-snapshot "$CBSROS_SNAPSHOT" --razzball-snapshot "$RAZZBALL_SNAPSHOT" | tee /tmp/bake.log
          python3 pipelines/pin_naming_manifest.py --source-label "supabase:players"
          make sync

      - name: Validate (report only; pages.yml is the blocking gate)
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          make validate 2>&1 | tee /tmp/validate.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bake"; tail -15 /tmp/bake.log 2>/dev/null
            echo "## Validate outcome: ${{ steps.validate.outcome }}"
            grep -E "^(FAIL|ERROR):|make: \*\*\*|Error" /tmp/validate.log 2>/dev/null | head -40
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit bake to branch
        run: |
          git config user.name "bake-players[bot]"
          git config user.email "bake-players@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "main" ]; then branch="bake/run-${GITHUB_RUN_ID}"; git checkout -b "$branch"; fi
          git add data/fixtures/current/players.json data/fixtures/current/players.naming-manifest.json dist app output/reference-build-report.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No bake changes."; exit 0; fi
          git commit -m "Bake players.json via GitHub Actions (validate: ${{ steps.validate.outcome }})"
          git push origin "HEAD:$branch"
