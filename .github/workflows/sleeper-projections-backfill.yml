name: Sleeper weekly projections backfill (JEG-540)

# One-off measurement pull: Sleeper's weekly projections for past and current
# seasons, for the projection-error and projection-movement measurements
# (JEG-540, JEG-530). Writes nothing to Supabase and publishes nothing: the
# result is uploaded as a workflow artifact and committed by a session after
# review. Sleeper is an internal source only (CLAUDE.md branding).
#
#   push to sleeper-backfill/*  -> run with the defaults
#   workflow_dispatch           -> choose seasons and weeks

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "seasons, e.g. 2018-2026"
        required: false
        default: "2018-2026"
      weeks:
        description: "weeks, e.g. 1-18"
        required: false
        default: "1-18"
  push:
    branches: ["sleeper-backfill/*"]

permissions:
  contents: read

concurrency:
  group: sleeper-projections-backfill
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull
        run: |
          python3 pipelines/pull_sleeper_projections.py \
            --seasons "${{ github.event.inputs.seasons || '2018-2026' }}" \
            --weeks "${{ github.event.inputs.weeks || '1-18' }}" \
            --out out/weekly_projections_sleeper.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sleeper-weekly-projections
          path: out/
          retention-days: 14
