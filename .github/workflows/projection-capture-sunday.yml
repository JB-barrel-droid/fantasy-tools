name: Projection capture, Sunday pre-kickoff (JEG-944)

# Jeremy 2026-10-23: a full copy of each source's forward projections after the Tuesday
# flip AND a Sunday pre-kickoff copy. This workflow is the Sunday copy for CBS and Razzball
# (ESPN's comes from espn-weekly-store.yml's Sunday run). It pulls the two sources and runs
# pipelines/capture_projections_only.py: writes public.source_projection_captures only. It
# does not touch cbs_ros_projections or razzball_projections and dispatches nothing, so it
# can never move a published value. A missing copy is failed loudly by
# pipelines/check_projection_captures.py in espn-weekly-store.yml.
#
# Scheduler owner: Supabase pg_cron `projection-capture-sunday` (15:30 UTC Sunday),
# supabase/migrations/jeg944_source_projection_captures_20261023.sql. No `schedule:`.
# workflow_dispatch is dry unless mode=write.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry or write"
        required: false
        default: "dry"

permissions:
  contents: read

concurrency:
  group: projection-capture-sunday
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      # JEG-1377: three tries, 2 then 4 minutes apart. Pulls are read-only and the writer
      # keeps the first copy of each horizon, so a retry never doubles or replaces rows.
      # A run that never starts is retried by the 16:20 UTC Sunday run of
      # espn-weekly-store.yml, which also goes red before kickoff if a copy is still missing.
      - name: Pull CBS and Razzball, then capture
        env:
          EVENT_MODE: ${{ github.event.inputs.mode }}
          SUPABASE_BYTES_CALLER: projection-capture-sunday:pull-cbs-and-razzball-then-capture
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          flag="--dry-run"
          [ "$EVENT_MODE" = "write" ] && flag=""
          attempt=1
          until python3 pipelines/pull_cbs_ros_projections.py --date "$(date -u +%F)" --out-dir /tmp/cbsros_snapshot &&
                python3 pipelines/pull_razzball_ros.py --out-dir /tmp/razzball &&
                python3 pipelines/capture_projections_only.py --cbs /tmp/cbsros_snapshot --razzball /tmp/razzball $flag; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=projection capture sunday::failed after $attempt tries"; exit 1
            fi
            echo "::warning title=projection capture sunday::try $attempt failed; retrying in $((attempt * 120))s"
            sleep $((attempt * 120))
            attempt=$((attempt + 1))
          done

      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && github.event.inputs.mode == 'write'
        env:
          SUPABASE_BYTES_CALLER: projection-capture-sunday:record-monitored-check
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id projection_capture_sunday --owner projection-capture-sunday.yml --outcome "${{ job.status }}"

      - name: Retain Supabase byte counters (JEG-1458)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: supabase-bytes-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-bytes/*.md
          if-no-files-found: ignore
          retention-days: 14
