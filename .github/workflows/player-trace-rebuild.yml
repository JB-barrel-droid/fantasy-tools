name: Rebuild player trace

# Rebuilds the player trace artifact (dist/modules/player-trace.json)
# from the latest pipeline data. The served monitor page
# (dist/modules/dashboard.html, "Player Trace") reads it.
#
# Scheduler owner: Supabase pg_cron `trigger-player-trace-live`, daily 12:47 UTC
# (after the 11:45 rebuild-chain-bake-live run publishes the day's bake).
# Was every 6 h at :47 until paused 2026-10-07; re-enabled daily 2026-10-08
# (producers lane, supabase/migrations/producers_schedule_tidy_20261008.sql):
# a 6-hourly commit to main for an internal page was churn, a stale trace on a
# served page was worse. No `schedule:` here, so there is one owner.

on:
  workflow_dispatch:

permissions:
  contents: read  # JEG-1441: main writes use the environment-scoped App.

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    environment: main-writer
    runs-on: ubuntu-latest  # Isolate App credentials from shared runners.
    steps: &writer-steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py 2>/dev/null || true
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Rebuild player trace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipelines/build_player_trace.py
          cp dist/modules/player-trace.json dist/modules/player-trace.json 2>/dev/null || true

      - name: Mint main writer token
        id: main-writer
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2, pinned
        with:
          app-id: ${{ secrets.MAIN_WRITER_APP_ID }}
          private-key: ${{ secrets.MAIN_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit and push if changed
        env:
          MAIN_WRITER_TOKEN: ${{ steps.main-writer.outputs.token }}
          BRANCH_WRITER_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!python3 -B "$GITHUB_WORKSPACE/.github/scripts/main-writer-credential.py"'
          GIT_CONFIG_KEY_2: credential.useHttpPath
          GIT_CONFIG_VALUE_2: 'true'
        run: |
          # JEG-1215: only publication pauses; upstream/downstream work continues.
          release_guard() {
            if python3 pipelines/main_write_guard.py --writer player-trace-rebuild-1 --phase "$1" --target "${GITHUB_REF_NAME:-main}"; then
              return 0
            else
              rc=$?
              if [ "$rc" = 75 ]; then exit 0; fi
              exit "$rc"
            fi
          }
          release_push() {
            release_guard push
            if [ "$#" -eq 0 ]; then set -- origin "HEAD:${GITHUB_REF:?}"; fi
            git push "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/modules/player-trace.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            release_guard stage
            git commit -m "Automated player trace rebuild (GitHub Actions)"
            # Push-race guard (2026-10-03): automated pushers (the 30-min health
            # cron, other workflows) can land commits on main between this job's
            # checkout and this push. Rebase onto the latest main first so the
            # push stays fast-forward instead of failing non-fast-forward.
            # --autostash: this step deliberately leaves unstaged changes behind
            # (e.g. the held-back partial fixture on a red chain); stash them
            # across the rebase instead of refusing.
            git pull --rebase --autostash origin main
            release_push
          fi

      # Monitoring: record this run in Supabase monitoring.check_observations,
      # red or green. A run that never happens is flagged `missed` by the
      # evaluator. Never fails the job. Declared in config/monitoring_coverage.json.
      - name: Retain deferred publication (player-trace-rebuild-1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deferred-player-trace-rebuild-1-${{ github.run_attempt }}
          path: output/release-publications/player-trace-rebuild-1/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record monitored check
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/record_monitor_check.py --check-id player_trace_rebuild --owner player-trace-rebuild.yml --outcome "${{ job.status }}"

  rebuild-branch:
    if: github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
    runs-on: ${{ vars.DATA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps: *writer-steps
