name: Health artifacts (non-Muse producer + watch)

# JEG-414 (ARCH-013). The monitor's health writer, every 6 hours:
#   1. Builds source-import-health.json and pipeline-checkpoints.json in CI
#      and PUBLISHES them to dist/modules on main (cut over from Muse's
#      30-min dashboard push, 2026-10-06). C2 uses the Supabase landing time
#      when no Mac-local pull file exists (GAP-C2-MTIME), never a file mtime.
#   2. Measures the age of the SERVED artifacts from their own timestamps
#      and records each result in Supabase monitoring.check_observations.
#   3. Fails (red) when a served artifact is older than 720 minutes.
#   4. Evaluates every check and snapshots the result
#      (public.monitoring_refresh_summary -> monitoring-summary.json). This is
#      the only evaluator run: the 5-minute pg_cron evaluator was retired
#      2026-10-08 (pre-launch: no 5-minute jobs). If this workflow stops, the
#      page sees monitoring-summary.json age past 720 min and turns red.
#   5. Opens/closes deduplicated `ops-alert` GitHub issues for real failures
#      (pipelines/monitor_alerts.py). Never blocks a deploy.

# Scheduler owner: Supabase pg_cron `health-artifacts-live` (50 */6 * * *,
# supabase/migrations/20261008_monitoring_6h_and_posture.sql). No `schedule:`
# here, so there is one owner (ops-ownership-001: Supabase first).
on:
  workflow_dispatch:
  push:
    branches: ["health/**"]

permissions:
  contents: write  # publish the health artifacts to main (JEG-414)
  actions: write   # dispatch pages.yml; GITHUB_TOKEN pushes don't trigger it (JEG-274)
  issues: write    # ops-alert issues (pipelines/monitor_alerts.py, GAP-ALERT-CHANNEL)

concurrency:
  group: health-artifacts
  cancel-in-progress: false

jobs:
  produce-and-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Build health artifacts
        id: build
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          week=$(python3 pipelines/nfl_week.py)
          rc=0
          # Stamp Supabase -> data/raw first (same as rebuild-chain.yml).
          for src in fantasycalc usatoday fantasypros espn cbs cbsros razzball; do
            python3 pipelines/import_supabase_references.py --source "$src" >> /tmp/build.log 2>&1 || echo "import $src exit $?" >> /tmp/build.rc
          done
          # verify_import_health exits 1 when its gate is RED; that is a
          # successfully produced (red) health artifact, not a producer
          # failure. Producer success = the artifact was written.
          python3 pipelines/verify_import_health.py --nfl-week "$week" >> /tmp/build.log 2>&1 || echo "verify_import_health gate exit $? (artifact still produced)" >> /tmp/build.log
          python3 pipelines/build_pipeline_checkpoints.py >> /tmp/build.log 2>&1 || { echo "build_pipeline_checkpoints exit $?" >> /tmp/build.rc; }
          test -s output/source-import-health.json || echo "source-import-health.json missing" >> /tmp/build.rc
          test -s output/pipeline-checkpoints.json || echo "pipeline-checkpoints.json missing" >> /tmp/build.rc
          tail -25 /tmp/build.log
          if [ -s /tmp/build.rc ]; then sed "s/^/::error title=producer::/" /tmp/build.rc; tail -8 /tmp/build.log | sed "s/^/::warning title=producer-log::/"; exit 1; fi

      - name: Annotate non-ok import-health sources
        if: always()
        run: |
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("output/source-import-health.json"))
          except Exception as e:
              print(f"::warning title=import-health::no artifact ({e})")
              raise SystemExit(0)
          for src, e in sorted((d.get("sources") or {}).items()):
              st = e.get("status")
              if st != "ok":
                  why = (e.get("failure_reason") or e.get("detail") or e.get("reason") or "")[:300]
                  print(f"::notice title=import-health {src}::{st} -- {why}")
          PY

      - name: Annotate checkpoint verdicts
        if: always()
        run: |
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("output/pipeline-checkpoints.json"))
          except Exception as e:
              print(f"::warning title=checkpoints::no artifact ({e})")
              raise SystemExit(0)
          srcs = d.get("sources") or {}
          items = srcs.items() if isinstance(srcs, dict) else [(x.get("source"), x) for x in srcs]
          for src, e in sorted(items):
              cps = e.get("checkpoints", e)
              row = " ".join(f"{k.split('_')[0]}={v.get('status')}" for k, v in cps.items() if isinstance(v, dict))
              print(f"::notice title=checkpoints {src}::{row}")
          PY

      # Publish only a successfully produced pair; a broken build never
      # replaces the served artifacts (the watcher then reports them aging).
      - name: Publish to the monitor (JEG-414)
        id: publish
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          cp output/source-import-health.json dist/modules/source-import-health.json
          cp output/pipeline-checkpoints.json dist/modules/pipeline-checkpoints.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/modules/source-import-health.json dist/modules/pipeline-checkpoints.json
          if git diff --cached --quiet; then echo "pushed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "Health artifacts (CI, JEG-414)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed=true" >> $GITHUB_OUTPUT; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::could not push health artifacts after 3 attempts"; exit 1

      - name: Trigger Pages deploy (JEG-274)
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/d.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "pages dispatch HTTP $code"; cat /tmp/d.json || true
          [ "$code" = "204" ]

      - name: Watch served artifacts + record observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          producer_ok=$([ "${{ steps.build.outcome }}" = "success" ] && echo true || echo false)
          python3 pipelines/health_artifacts_watch.py --producer-ok "$producer_ok" 2>&1 | tee /tmp/watch.log

      # "Is everything working?" banner source: public.monitoring_refresh_summary()
      # records pg_cron history, runs the evaluator over
      # monitoring.check_observations and returns the summary (plus the
      # security posture). Runs after the watch step so this run's own
      # observations are in it. Written even when the read fails (red,
      # fail-closed) so the page never shows a stale green. Separate commit from
      # the health artifacts above so that step's publish rules stay unchanged.
      - name: Build monitoring summary
        id: msummary
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipelines/build_monitoring_summary.py --out output/monitoring-summary.json

      - name: Publish monitoring summary
        id: publish_summary
        if: always() && github.ref == 'refs/heads/main' && hashFiles('output/monitoring-summary.json') != ''
        run: |
          cp output/monitoring-summary.json dist/modules/monitoring-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/modules/monitoring-summary.json
          if git diff --cached --quiet; then echo "pushed=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "Monitoring summary (CI)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed=true" >> $GITHUB_OUTPUT; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::could not push monitoring summary after 3 attempts"; exit 1

      - name: Trigger Pages deploy for the monitoring summary
        if: steps.publish_summary.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/d2.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "pages dispatch HTTP $code"; cat /tmp/d2.json || true
          [ "$code" = "204" ]

      # Drift between config/monitoring_coverage.json and what is live in
      # Supabase (a pg_cron job no check covers, a check with no manifest row).
      - name: Audit monitoring coverage
        if: always() && hashFiles('output/monitoring-summary.json') != ''
        run: python3 pipelines/audit_monitoring_coverage.py output/monitoring-summary.json

      # Real failures only (rebuild chain not publishing, a source stuck,
      # monitor unreadable, security regression): one `ops-alert` issue per
      # condition, opened once and closed when it clears. Everything else is a
      # warning on the page. Never fails the run.
      - name: Alert on real failures
        if: always() && github.ref == 'refs/heads/main' && hashFiles('output/monitoring-summary.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 pipelines/monitor_alerts.py --summary output/monitoring-summary.json --import-health dist/modules/source-import-health.json

      - name: Summary
        if: always()
        # Runs under `bash -e`: every file read is guarded with `|| true`
        # because /tmp/build.rc only exists when the producer recorded an
        # error. A bare `cat` on the missing file exits 1 and fails the whole
        # workflow even though producer + watcher both succeeded (2026-10-06).
        run: |
          { echo "## Health artifacts"; echo "producer build: ${{ steps.build.outcome }}"; echo '```'; cat /tmp/build.rc 2>/dev/null || true; tail -25 /tmp/build.log 2>/dev/null || true; echo; cat /tmp/watch.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-artifacts
          path: |
            output/source-import-health.json
            output/pipeline-checkpoints.json
          if-no-files-found: warn
          retention-days: 7
