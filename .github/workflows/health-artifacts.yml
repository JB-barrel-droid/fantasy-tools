name: Health artifacts (non-Muse producer + watch)

# JEG-414 (ARCH-013). The monitor's health writer, every 30 minutes:
#   1. Builds source-import-health.json and pipeline-checkpoints.json in CI
#      and STORES them in Supabase public.ops_artifacts (JEG-414 follow-up:
#      replaced git commits to main that caused 48+ bot commits/day and
#      Pages-deploy cancellations). C2 uses the Supabase landing time when no
#      Mac-local pull file exists (GAP-C2-MTIME), never a file mtime.
#   2. Measures the age of the stored artifacts from their own timestamps
#      and records each result in Supabase monitoring.check_observations.
#   3. Fails (red) when a stored artifact is older than 60 minutes.
# A pg_cron evaluator (monitoring-evaluator-5min) marks these checks
# 'missed' if this workflow itself stops reporting.

# Scheduler owner: Supabase pg_cron `health-artifacts-live` (11,41 * * * *,
# supabase/migrations/jeg414_health_artifacts_pg_cron.sql). No `schedule:`
# here, so there is one owner (ops-ownership-001: Supabase first).
on:
  workflow_dispatch:
  push:
    branches: ["health/**"]

permissions:
  contents: read   # no writes to main (JEG-414 follow-up: artifacts go to Supabase)
  actions: read

concurrency:
  group: health-artifacts
  cancel-in-progress: false

jobs:
  produce-and-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install standalone Supabase client
        run: |
          mkdir -p /tmp/gh_shim
          cp pipelines/gh_sbclient.py /tmp/gh_shim/sbclient.py
          echo "PYTHONPATH=/tmp/gh_shim:$PYTHONPATH" >> $GITHUB_ENV

      - name: Build health artifacts
        id: build
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          week=$(python3 pipelines/nfl_week.py)
          rc=0
          # Stamp Supabase -> data/raw first (same as rebuild-chain.yml).
          for src in fantasycalc usatoday fantasypros espn cbs cbsros razzball; do
            python3 pipelines/import_supabase_references.py --source "$src" >> /tmp/build.log 2>&1 || echo "import $src exit $?" >> /tmp/build.rc
          done
          # verify_import_health exits 1 when its gate is RED; that is a
          # successfully produced (red) health artifact, not a producer
          # failure. Producer success = the artifact was written.
          python3 pipelines/verify_import_health.py --nfl-week "$week" >> /tmp/build.log 2>&1 || echo "verify_import_health gate exit $? (artifact still produced)" >> /tmp/build.log
          python3 pipelines/build_pipeline_checkpoints.py >> /tmp/build.log 2>&1 || { echo "build_pipeline_checkpoints exit $?" >> /tmp/build.rc; }
          test -s output/source-import-health.json || echo "source-import-health.json missing" >> /tmp/build.rc
          test -s output/pipeline-checkpoints.json || echo "pipeline-checkpoints.json missing" >> /tmp/build.rc
          tail -25 /tmp/build.log
          if [ -s /tmp/build.rc ]; then sed "s/^/::error title=producer::/" /tmp/build.rc; tail -8 /tmp/build.log | sed "s/^/::warning title=producer-log::/"; exit 1; fi

      - name: Annotate non-ok import-health sources
        if: always()
        run: |
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("output/source-import-health.json"))
          except Exception as e:
              print(f"::warning title=import-health::no artifact ({e})")
              raise SystemExit(0)
          for src, e in sorted((d.get("sources") or {}).items()):
              st = e.get("status")
              if st != "ok":
                  why = (e.get("failure_reason") or e.get("detail") or e.get("reason") or "")[:300]
                  print(f"::notice title=import-health {src}::{st} -- {why}")
          PY

      - name: Annotate checkpoint verdicts
        if: always()
        run: |
          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("output/pipeline-checkpoints.json"))
          except Exception as e:
              print(f"::warning title=checkpoints::no artifact ({e})")
              raise SystemExit(0)
          srcs = d.get("sources") or {}
          items = srcs.items() if isinstance(srcs, dict) else [(x.get("source"), x) for x in srcs]
          for src, e in sorted(items):
              cps = e.get("checkpoints", e)
              row = " ".join(f"{k.split('_')[0]}={v.get('status')}" for k, v in cps.items() if isinstance(v, dict))
              print(f"::notice title=checkpoints {src}::{row}")
          PY

      # Store artifacts in Supabase instead of committing to main.
      # A broken build never replaces the stored artifacts (the watcher then
      # reports them aging and the check goes red). No git commit, no push,
      # no Pages dispatch.
      - name: Store health artifacts in Supabase (JEG-414 follow-up)
        id: store
        if: steps.build.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "pipelines")
          import ops_artifact_store as store
          for name, path in [
              ("pipeline-checkpoints", "output/pipeline-checkpoints.json"),
              ("source-import-health", "output/source-import-health.json"),
          ]:
              payload = json.load(open(path))
              store.upsert(name, payload)
              print(f"stored {name}")
          PY

      - name: Watch stored artifacts + record observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          producer_ok=$([ "${{ steps.build.outcome }}" = "success" ] && echo true || echo false)
          python3 pipelines/health_artifacts_watch.py --producer-ok "$producer_ok" 2>&1 | tee /tmp/watch.log

      # Audit coverage drift between config/monitoring_coverage.json and what
      # is live in Supabase. Reads public.monitoring_summary() via service key.
      - name: Audit monitoring coverage
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipelines/build_monitoring_summary.py --out output/monitoring-summary.json
          python3 pipelines/audit_monitoring_coverage.py output/monitoring-summary.json

      - name: Summary
        if: always()
        # Runs under `bash -e`: every file read is guarded with `|| true`
        # because /tmp/build.rc only exists when the producer recorded an
        # error. A bare `cat` on the missing file exits 1 and fails the whole
        # workflow even though producer + watcher both succeeded (2026-10-06).
        run: |
          { echo "## Health artifacts"; echo "producer build: ${{ steps.build.outcome }}"; echo '```'; cat /tmp/build.rc 2>/dev/null || true; tail -25 /tmp/build.log 2>/dev/null || true; echo; cat /tmp/watch.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-artifacts
          path: |
            output/source-import-health.json
            output/pipeline-checkpoints.json
          if-no-files-found: warn
          retention-days: 7
