<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiver board fixture · JEG-1420</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../app/v2/waiver-board-view.css">
<style>body { margin: 0; padding: 24px 16px; background: #f5f7f5; } main { padding: 16px; background: white; }</style>
<main id="board"></main>
<script src="../../../app/v2/waiver-board-view.js"></script>
<script>
// A dedicated harness reading the unchanged, schema-validated #1239 golden.
// Serve the repository root: python3 -m http.server 8000
// ?swaps=two_moves selects a saved, adapter-validated 0.2 fixture.
window.renderBoard = board => TradeValueWaiverBoardView.render(document.getElementById('board'), board, {
  onSettings: setting => { window.lastSettings = setting; }
});
const swapCase = new URLSearchParams(location.search).get('swaps');
fetch(swapCase ? 'swaps_0_2.json' : '../waiver_board/expected_half_ppr_12.json').then(response => {
  if (!response.ok) throw new Error('Fixture unavailable');
  return response.json();
}).then(payload => {
  if (swapCase && !Object.hasOwn(payload.cases, swapCase)) throw new Error('Unknown swap fixture');
  const board = swapCase ? payload.cases[swapCase] : payload;
  window.fixtureBoard = board; window.renderBoard(board);
}).catch(error => {
  const message = document.createElement('p');
  message.setAttribute('role', 'alert');
  message.textContent = error.message;
  document.getElementById('board').replaceChildren(message);
});
</script>
</html>
