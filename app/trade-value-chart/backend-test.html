<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Data Backend Test (JEG-327)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .ok { color: green; } .fail { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>api.* Backend Connectivity Test</h1>
  <div id="status">Loading...</div>
  <pre id="output"></pre>

  <script>
    // Config injected - in production these come from the hosting setup
    window.TRADE_VALUE_SUPABASE_URL = "https://iskiybsimubiujwuchsl.supabase.co";
    // Note: anon key must be configured for live data
  </script>
  <script src="assets/product-data.js"></script>
  <script>
    async function run() {
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      try {
        if (!window.TradeValueProductData) {
          throw new Error("TradeValueProductData not loaded");
        }
        status.innerHTML = '<span class="ok">Module loaded. Attempting backend connection...</span>';

        // Try to get product options (smallest view)
        const api = window.TradeValueProductData;
        output.textContent = "API methods available: " +
          Object.keys(api).filter(k => typeof api[k] === 'function').join(', ');

        status.innerHTML = '<span class="ok">Backend module ready. Configure anon key for live data.</span>';
      } catch (e) {
        status.innerHTML = '<span class="fail">Error: ' + e.message + '</span>';
        output.textContent = e.stack;
      }
    }
    run();
  </script>
</body>
</html>
