<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opponent inclusion preview (JEG-1231)</title>
  <!-- Private component preview. Not part of the publish: pipelines/build_v2_page.py copies a named file list and this
       folder is not on it. Tokens come from the Oct 26 direction (JEG-1209). Team names are illustrative. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../app/v2-concept/concept.css">
  <link rel="stylesheet" href="../../app/v2/opponent-inclusion.css">
  <style>
    .pv { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
    .pv h1 { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 1.2; }
    .pv-note { color: var(--muted); font-size: 12px; }
    .pv-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .pv-bar label { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    .pv-bar select, .pv-bar button { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .pv-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .pv-card h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
    .pv-card ol { margin: 0; padding-left: 20px; }
    .pv-card code { font-size: 12px; color: var(--muted); }
    @media (min-width: 900px) { .pv-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; } }
    @media (max-width: 899px) { .pv-grid { display: grid; gap: 16px; } }
  </style>
</head>
<body>
  <main class="pv">
    <header>
      <h1>Opponents to search</h1>
      <p class="pv-note">Private preview of the league trade search control (JEG-1231). Sample teams, no values. Nothing here is saved.</p>
    </header>
    <div class="pv-bar" role="group" aria-label="Preview controls">
      <label>State
        <select id="pvState">
          <option value="league">Sample league</option>
          <option value="duplicates">Two teams with one name</option>
          <option value="profile">A manager marked won't trade</option>
          <option value="allExcluded">Every opponent left out</option>
          <option value="none">No other teams</option>
        </select>
      </label>
      <button type="button" id="pvRename">Rename team 3</button>
      <button type="button" id="pvReadd">Remove and re-add team 4</button>
      <button type="button" id="pvTheme" aria-pressed="false">Dark</button>
    </div>
    <div class="pv-grid">
      <div id="pvControl"></div>
      <section class="pv-card" aria-labelledby="pvSearchTitle">
        <h2 id="pvSearchTitle">The search would run against</h2>
        <ol id="pvSearch"></ol>
        <p class="pv-note" id="pvSearchNone" hidden>No team. No trades can be found.</p>
        <p class="pv-note">Stored view state: <code id="pvStored"></code></p>
        <p class="pv-note">League star and manager profiles are read, never written.</p>
      </section>
    </div>
  </main>
  <script src="../../app/v2/opponent-inclusion.js"></script>
  <script>
  (function () {
    "use strict";
    const I = window.TradeValueOpponentInclusion;
    const roster = [{key: "p1", name: "Sample player", pos: "RB"}];
    let seq = 0;
    const team = (name, entries) => ({id: `team_preview_${++seq}`, name, entries: entries === undefined ? roster : entries});
    function league(kind) {
      seq = 0;
      const names = ["Your team", "Gridiron Gang", "Sunday Scaries", "Waiver Wire Warriors", "Bench Mob", "Taco Corp", "Fourth and Long",
        "The Replacements", "Hail Marys", "Red Zone Regulars", "Ground Game", "Two Minute Drill"];
      if (kind === "none") names.length = 1;
      if (kind === "duplicates") { names[5] = "Sunday Scaries"; }
      const teams = names.map((n, i) => team(n, i === 9 ? [] : roster));
      return {id: "league_preview", teams, myTeamId: teams[0].id, ui: {}};
    }
    const params = new URLSearchParams(location.search);
    let kind = params.get("state") || "league";
    let ws = league(kind);
    let profileOut = new Set();
    const opts = () => ({profileExcluded: id => profileOut.has(id)});
    const save = state => { ws = {...ws, ui: {...ws.ui, ...I.patch(state)}}; draw(); };
    const control = I.createControl({
      idPrefix: "pvOi",
      onToggle: (id, include) => save(I.setIncluded(I.read(ws), ws, id, include)),
      onIncludeAll: () => save(I.includeAll(I.read(ws), ws)),
      onExcludeAll: () => save(I.excludeAll(I.read(ws), ws))
    });
    document.getElementById("pvControl").append(control.element);
    function setKind(next) {
      kind = next;
      ws = league(kind);
      profileOut = new Set(kind === "profile" ? [ws.teams[4].id] : []);
      if (kind === "allExcluded") ws.ui = I.patch(I.excludeAll(null, ws));
      if (kind === "league") ws.ui = I.patch(I.setIncluded(I.setIncluded(null, ws, ws.teams[2].id, false), ws, ws.teams[3].id, false));
      draw();
    }
    function draw() {
      const model = I.describe(ws, I.read(ws), opts());
      control.update(model);
      const list = document.getElementById("pvSearch");
      const search = I.searchOpponents(ws, I.read(ws), opts());
      list.replaceChildren(...search.map(t => { const li = document.createElement("li"); li.textContent = t.entries.length ? t.name : `${t.name} (no roster, skipped)`; li.dataset.teamId = t.id; return li; }));
      document.getElementById("pvSearchNone").hidden = search.length > 0;
      document.getElementById("pvStored").textContent = JSON.stringify(I.read(ws));
    }
    document.getElementById("pvState").value = kind;
    document.getElementById("pvState").addEventListener("change", e => setKind(e.target.value));
    document.getElementById("pvRename").addEventListener("click", () => {
      const t = ws.teams[2];
      if (!t) return;
      ws = {...ws, teams: ws.teams.map(x => (x.id === t.id ? {...x, name: x.name.endsWith(" (renamed)") ? x.name : `${x.name} (renamed)`} : x))};
      draw();
    });
    document.getElementById("pvReadd").addEventListener("click", () => {
      const t = ws.teams[3];
      if (!t) return;
      // Removing a team drops its id; the team that comes back gets a new id and arrives included, like any new team.
      ws = {...ws, teams: ws.teams.filter(x => x.id !== t.id).concat([team(t.name, t.entries)])};
      ws = {...ws, ui: {...ws.ui, ...I.patch(I.normalize(ws.ui[I.UI_KEY], ws))}};
      draw();
    });
    const theme = document.getElementById("pvTheme");
    theme.addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      theme.setAttribute("aria-pressed", String(dark));
    });
    if (params.get("theme") === "dark") theme.click();
    window.__pv = {get ws() { return ws; }, setKind, I};
    setKind(kind);
  })();
  </script>
</body>
</html>
